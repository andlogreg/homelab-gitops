apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  # No secret.reloader.stakater.com/reload annotation here, on purpose. forgejo-secrets
  # carries SECRET_KEY, which encrypts data held in the database (2FA secrets, mirror
  # credentials) - rotating it in place makes that data undecryptable, and restarting
  # faster does not help. The admin credential in the same Secret is applied only when
  # the account is absent, so a restart would not pick up a changed password either.
  # Same call, for the same reason, as litellm-secrets.
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate: DB_TYPE is sqlite3, so the database is a
  # file on an RWO local-path PVC and migrates at startup. Nothing fences that volume on a
  # single node, so a rolling update would put two versions on the same file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
      # Forgejo's first run is a web installer: it creates the database, creates the
      # admin account, and only then sets INSTALL_LOCK. Clicking through it leaves
      # nothing in git, so the next rebuild comes back up empty and unlocked again.
      # This container does that same work from the declared config instead, which is
      # what makes INSTALL_LOCK=true safe to set rather than merely locking everyone
      # out of an instance that was never set up.
      #
      # Only `args` is set here, never `command`. The image entrypoint is
      # `dumb-init -- docker-entrypoint.sh`, which renders app.ini and applies every
      # FORGEJO__* variable through environment-to-ini before exec'ing whatever it is
      # given. Overriding `command` would skip all of that and run migrate against an
      # unconfigured app.ini.
      - name: init-forgejo
        image: data.forgejo.org/forgejo/forgejo:14.0.5-rootless
        args:
        - /bin/sh
        - -c
        - |
          set -eu
          forgejo migrate
          if forgejo admin user list --admin | tail -n +2 | awk '{print $2}' \
               | grep -qxF "$FORGEJO_ADMIN_USERNAME"; then
            echo "admin user '$FORGEJO_ADMIN_USERNAME' already exists - nothing to do"
          else
            echo "creating admin user '$FORGEJO_ADMIN_USERNAME'"
            forgejo admin user create --admin \
              --username "$FORGEJO_ADMIN_USERNAME" \
              --password "$FORGEJO_ADMIN_PASSWORD" \
              --email "$FORGEJO_ADMIN_EMAIL" \
              --must-change-password=false
          fi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        envFrom:
        - configMapRef:
            name: forgejo-config
        - secretRef:
            name: forgejo-secrets
        volumeMounts:
        - mountPath: /var/lib/gitea
          name: forgejo-data
      containers:
      - name: forgejo
        image: data.forgejo.org/forgejo/forgejo:14.0.5-rootless
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        envFrom:
        - configMapRef:
            name: forgejo-config
        - secretRef:
            name: forgejo-secrets
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 2222
          name: ssh
          protocol: TCP
        # A startupProbe replaces what initialDelaySeconds: 60 used to do on the two probes
        # below. The old shape was a lenient readiness probe: it could not report Ready
        # before 60s no matter how fast the app came up, and with periodSeconds: 90 it could
        # take another 90s to notice. Worse, a start that was genuinely stuck just kept
        # being retried. A startupProbe polls quickly, gives up after a bounded 450s, and
        # suspends the other two probes until it passes - so a stuck start fails the rollout
        # instead of hanging, and a fast start is reported as soon as it is true. The budget
        # is a ceiling rather than an estimate: it has to hold when a shared-base edit
        # restarts every app on the node together.
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 90
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/healthz
            port: 3000
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/healthz
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/gitea
          name: forgejo-data
      volumes:
      - name: forgejo-data
        persistentVolumeClaim:
          claimName: forgejo-data
