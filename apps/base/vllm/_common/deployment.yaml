apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  replicas: 1
  # Recreate for the same reason as ollama: this pod requests a GPU and the GPU host has one
  # card, so surging a second pod would wait forever for hardware that does not exist.
  strategy:
    type: Recreate
  # Raised from the 600s default because the startup budget below is longer than that, and
  # whichever of the two is shorter is the one that actually decides the outcome. Loading a
  # model can legitimately outlast ten minutes; the point of the probe is to bound that wait,
  # not to have the rollout time out underneath it. Now sized to exceed the startup budget
  # below, which had to grow to cover a first-start model download.
  progressDeadlineSeconds: 8400
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.27.1
        command: ["/bin/sh", "-c"]
        args: [
          "vllm serve $(MODEL_NAME) $(VLLM_ARGS)"
        ]
        env:
        # optional, and deliberately so. The checkpoint served on the GPU host is Apache-2.0 and
        # ungated, so a missing token must not stop the pod starting -- without this the container
        # sits in CreateContainerConfigError whenever the secret is absent, which is the state the
        # CPU overlay is permanently in. The token is still worth having when present: anonymous
        # Hugging Face downloads are rate-limited, and these checkpoints are ~21 GB.
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
              optional: true
        ports:
        - containerPort: 8000
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: cache-volume
        # Replaces initialDelaySeconds: 300 on both probes. A model server is the clearest
        # case for a startupProbe: loading weights genuinely takes minutes, but a flat delay
        # cannot tell a slow load from a failed one. The budget below is bounded, so a load
        # that never finishes fails the rollout instead of hanging - see the raised
        # progressDeadlineSeconds above, which has to exceed this budget.
        #
        # 10s x 720 = 2 hours, raised from 90 (15 minutes). The first start of a model this
        # size is not a load, it is a DOWNLOAD: ~20 GiB of weights are fetched before the
        # server binds /health at all, which does not fit in fifteen minutes on a domestic
        # link. The old budget did not fail safely - the cache lives on a PVC, so each kill
        # resumed and made progress, and the symptom was a pod that looked like a crashloop
        # while actually working. That is the worst kind of wrong signal to have during a
        # bring-up, because it is indistinguishable from a real startup failure.
        #
        # Two hours rather than one because the measured rate is the thing that decides this,
        # and it was measured rather than guessed: 5.7 MiB/s sustained, i.e. ~52 minutes for
        # the weights ALONE, before loading them onto the card and capturing graphs. An hour
        # would have left the outcome resting on the download not slowing down. The budget is
        # a bound on a hang, not a schedule - setting it well above the expected time costs
        # nothing when the start succeeds, and the only thing it delays is the report of a
        # genuine hang.
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 720
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: cache-volume
        persistentVolumeClaim:
          claimName: vllm-data
