apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: n8n
  name: n8n
spec:
  ingressClassName: traefik
  rules:
  - host: n8n-staging.andlogreg.work
    http:
      paths:
      - backend:
          service:
            name: n8n
            port:
              number: 5678
        path: /
        pathType: Prefix
