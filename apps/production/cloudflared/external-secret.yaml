apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tunnel-credentials
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: cloudflared-tunnel-config
    template:
      data:
        config.yaml: |
          tunnel: {{ .tunnel_id }}
          metrics: 0.0.0.0:2000
          no-autoupdate: true
          credentials-file: /etc/cloudflared/creds/credentials.json
          ingress:
            - hostname: {{ .mealie_domain }}
              service: http://mealie.mealie.svc.cluster.local:80
            - service: http_status:404 # Catch-all
        credentials.json: "{{ .tunnel_secret }}"
  data:
  - secretKey: tunnel_secret # pragma: allowlist secret
    remoteRef:
      key: cloudflared-tunnel-secret
  - secretKey: tunnel_id # pragma: allowlist secret
    remoteRef:
      key: cloudflared-tunnel-id
  - secretKey: mealie_domain # pragma: allowlist secret
    remoteRef:
      key: mealie-domain
