apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-db-scheduled-backup
spec:
  schedule: "0 0 3 * * *"  # At 3am every day
  backupOwnerReference: self
  cluster:
    name: mealie-db-02
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
