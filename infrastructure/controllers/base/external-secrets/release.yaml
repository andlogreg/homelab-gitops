apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 12h
  chart:
    spec:
      chart: external-secrets
      version: "1.3.2"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
