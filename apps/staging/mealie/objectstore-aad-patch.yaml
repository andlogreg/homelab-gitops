# Move this cluster's live barman ObjectStore onto a container-scoped Entra identity, ahead of the
# other clusters. TRANSITIONAL: fold into the base ObjectStore once every cluster is across, then
# delete this patch.
#
# useDefaultAzureCredentials, NOT inheritFromAzureAD. The two look interchangeable in the CRD --
# both are "use Azure AD", both make the plugin emit no credential environment -- but they are not:
#
#   inheritFromAzureAD        -> the plugin passes `--credential managed-identity`, and barman
#                                builds a ManagedIdentityCredential, which talks to the IMDS
#                                endpoint at 169.254.169.254. There is no such endpoint on
#                                bare-metal Kubernetes, so it cannot work here at all.
#   useDefaultAzureCredentials -> `--credential default` -> DefaultAzureCredential, whose first
#                                step is EnvironmentCredential, which reads the three variables
#                                injected below.
#
# The credentials MUST arrive as container env: the plugin emits no credential env of its own on
# this path, and instanceSidecarConfiguration exposes `env` only -- no volumes -- so there is no
# file-based option.
#
# CONSEQUENCE WORTH KNOWING: env from secretKeyRef is resolved once, at pod start, and never
# refreshes. The sidecar used to re-read the storage account key from the API server on every
# archive call, so a rotation needed no restart. It does now: rotating this secret requires
# rolling the PostgreSQL instances. That is the accepted cost of a scoped credential.
- op: replace
  path: /spec/configuration/azureCredentials
  value:
    useDefaultAzureCredentials: true
- op: add
  path: /spec/instanceSidecarConfiguration
  value:
    env:
      - name: AZURE_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: cnpg-backup-creds
            key: AZURE_CLIENT_ID
      - name: AZURE_TENANT_ID
        valueFrom:
          secretKeyRef:
            name: cnpg-backup-creds
            key: AZURE_TENANT_ID
      - name: AZURE_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: cnpg-backup-creds
            key: AZURE_CLIENT_SECRET
