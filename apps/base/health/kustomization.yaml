apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# A database and nothing else: no Deployment, no Service, no application PVC. What reads this
# store is Grafana, over the cluster network, with its own read-only role.
resources:
  - external_secret.yaml
  - namespace.yaml
  - objectstore.yaml
  - postgresql.yaml
  - scheduled-backup.yaml
