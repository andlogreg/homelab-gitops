apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secrets
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: forgejo-secrets
  # The three FORGEJO__* keys are consumed by environment-to-ini, which the image
  # entrypoint runs against app.ini on every start. They are pinned here rather than
  # left to Forgejo's own first-run generation so a rebuild - or a Velero restore onto
  # a fresh PVC - lands on the same values as the data it is restoring.
  #
  # None of these belong in the rotating cloud/ Terraform: SECRET_KEY encrypts stored
  # data (2FA secrets, mirror credentials), so rotating it makes that data permanently
  # unreadable. They are seeded once, by hand, like the litellm and alertmanager keys.
  data:
  - secretKey: FORGEJO__security__SECRET_KEY # pragma: allowlist secret
    remoteRef:
      key: forgejo-secret-key
  - secretKey: FORGEJO__security__INTERNAL_TOKEN # pragma: allowlist secret
    remoteRef:
      key: forgejo-internal-token
  - secretKey: FORGEJO__oauth2__JWT_SECRET # pragma: allowlist secret
    remoteRef:
      key: forgejo-oauth2-jwt-secret
  # Consumed by the init container, not by environment-to-ini - hence the plain names.
  - secretKey: FORGEJO_ADMIN_USERNAME # pragma: allowlist secret
    remoteRef:
      key: forgejo-admin-username
  - secretKey: FORGEJO_ADMIN_PASSWORD # pragma: allowlist secret
    remoteRef:
      key: forgejo-admin-password
  - secretKey: FORGEJO_ADMIN_EMAIL # pragma: allowlist secret
    remoteRef:
      key: forgejo-admin-email
