---
# The shared bot token and helios-only chat ID remain in the helios Key Vault;
# Alertmanager reads them from this mounted ESO-managed Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: alertmanager-telegram
  data:
    - secretKey: bot-token # pragma: allowlist secret
      remoteRef:
        key: alertmanager-telegram-bot-token
    - secretKey: chat-id # pragma: allowlist secret
      remoteRef:
        key: alertmanager-telegram-chat-id
