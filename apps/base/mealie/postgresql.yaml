apiVersion: postgresql.cnpg.io/v1
kind: Cluster
# BACKUP GENERATION CONVENTION: the `-NN` suffix is the backup generation. The barman
# plugin uses the Cluster name as the serverName, so each generation gets its own dir
# under `cnpg-backups/mealie/<mealie-db-NN>/`. On every cluster REBUILD, bump NN
# (-00 -> -01 -> ...) so the fresh cluster cannot overwrite the previous generation's
# WAL/base, and point recovery's externalCluster serverName at the prior NN, using that
# generation's LIVE ObjectStore (see the commented stanza below for the shape). Never reuse
# a retired NN; prune a retired serverName dir only after the new generation is healthy, and
# add the retired prefix to the storage account's retired-generation lifecycle rule.
metadata:
  name: mealie-db-00
spec:
  instances: 1

  # The instance pod already serves metrics on :9187; this only creates the PodMonitor
  # that makes Prometheus scrape it. Needed for WAL-archiving alerting, which reads
  # cnpg_pg_stat_archiver_* - those come from Postgres itself, so unlike the operator's
  # cnpg_collector_last_available_backup_timestamp (which reads a permanent 0 under the
  # barman-cloud PLUGIN, as opposed to the deprecated in-tree barmanObjectStore) they
  # are actually populated. Base-backup freshness is watched separately, via
  # kube-state-metrics custom-resource-state over the Backup CRs.
  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: mealie

  # bootstrap:
  #   recovery:
  #     source: mealie-db-backup
  #     database: mealie

  # externalClusters:
  #   - name: mealie-db-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: mealie-db-objectstore
  #         serverName: mealie-db-00

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mealie-db-objectstore
