apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  # Recreate is not optional here, and the reason is the GPU rather than any database. This
  # base manifest requests nvidia.com/gpu: 1 and is used unpatched on the GPU host, which
  # has exactly one card. A rolling update surges a second pod before retiring the first,
  # so that pod would wait forever for a GPU that does not exist and the rollout would
  # deadlock rather than fail. (The CPU-only overlays patch the request to 0.)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.32.15
          ports:
            - containerPort: 11434
              name: http
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          # /api/version is the cheapest documented endpoint that proves the API is up. The
          # server starts quickly - models are pulled and loaded on demand, not at boot - but
          # the budget matches its neighbours anyway, since it only bounds a stuck start and
          # a tight one gets a healthy app killed on a contended node. This probe cannot be
          # verified against a running instance
          # from either phoenix cluster: the CPU-only overlays cannot schedule this pod, and
          # the GPU host is powered off by design.
          startupProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /api/version
              port: 11434
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-data
