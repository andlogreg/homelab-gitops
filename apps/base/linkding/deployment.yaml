apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  annotations:
    # linkding-credentials arrives via envFrom, and kubelet never hot-reloads
    # env vars sourced from a secret - so a rotated superuser credential would
    # sit in the cluster unread until something happened to restart the pod.
    # Single replica, so this is a few seconds of downtime; the credential is
    # re-read cleanly on start, which is what makes it safe to automate.
    secret.reloader.stakater.com/reload: "linkding-credentials" # pragma: allowlist secret
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.45.0
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: linkding-config
            - secretRef:
                name: linkding-credentials
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data
