apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      containers:
      - name: vllm
        resources:
          limits:
            nvidia.com/gpu: "1"
            cpu: "10"
            # Raised from 20G. This is host RAM, not VRAM, and it bounds the load path rather
            # than the serving one: a 4-bit 27B checkpoint is ~21 GB of safetensors shards that
            # are read and staged on the CPU side before they reach the card, so a 20G ceiling
            # risks an OOMKill during startup that looks like a model problem. The node has
            # 32 GiB and the request below is unchanged, so this only widens the ceiling.
            memory: 26G
          requests:
            nvidia.com/gpu: "1"
            cpu: "2"
            memory: 6G
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "2Gi"
