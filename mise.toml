[tools]
cloudflared = "latest"
python = "3.12"        # pre-commit is a Python app; make the hook toolchain self-contained
pre-commit = "latest"
flux2 = "latest"
k3d = "latest"
k9s = "latest"
# Pinned, not "latest": Terraform stamps its own version into every state file it
# writes, and an older binary refuses to read state written by a newer one. An
# unpinned version let two machines drift apart until one could no longer read the
# state the other had written. Bump deliberately, on all machines.
terraform = "1.14"
velero = "latest"      # CLI for operating/verifying Velero backups on the phoenix clusters
azure-cli = { version = "latest", uvx_args = "--prerelease=allow" }

[settings]
experimental = true

[hooks]
enter = "bash ./scripts/setup_project"

[tasks.k8s-local-setup]
description = "Set up a local k8s cluster for quickly testing WIP changes"
run = "bash ./scripts/setup_cluster_local"
