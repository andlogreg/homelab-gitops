apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - scrapeconfig-proxmox-hosts.yaml
  - prometheusrule-ssd-wear.yaml
  - external-secret-alertmanager.yaml
  - external-secret-health-db-grafana.yaml
  - grafana-datasource-health.yaml
  - podmonitor-reloader.yaml
  - podmonitor-cloudflared.yaml
  - prometheusrule-backups.yaml
  # Host rules and the cloudflared/CronJob rules are production-only because their
  # TARGETS are: the proxmox-hosts ScrapeConfig and both cloudflared deployments exist
  # in this overlay alone. The backup rules above are shared with staging.
  - prometheusrule-proxmox-hosts.yaml
  - prometheusrule-workloads.yaml
  # The HomeAssistant liveness probe and its rule: production-only, because
  # this is the always-on plane and only production notifies.
  - probe-homeassistant.yaml
  - prometheusrule-homeassistant.yaml

# Dashboard-as-code: the kube-prometheus-stack Grafana sidecar auto-imports
# ConfigMaps labelled grafana_dashboard=1 from the monitoring namespace.
configMapGenerator:
  - name: grafana-dashboard-ssd-endurance
    files:
      - ssd-endurance.json=dashboards/ssd-endurance.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-backups
    files:
      - backups.json=dashboards/backups.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
  - name: grafana-dashboard-health-trends
    files:
      - health-trends.json=dashboards/health-trends.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
