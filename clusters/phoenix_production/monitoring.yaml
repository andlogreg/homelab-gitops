---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
spec:
  # The Alertmanager receiver config substitutes a value from an ESO-managed
  # Secret, so External Secrets has to be up first.
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/controllers/production
  prune: true
  # Keep this on the controllers path only. The configs path carries Grafana
  # dashboard JSON, which is full of ${...} Grafana variables that substitution
  # would mangle.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: alertmanager-telegram-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./monitoring/configs/production
  prune: true
