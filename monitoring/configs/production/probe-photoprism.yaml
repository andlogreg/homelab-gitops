apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: photoprism
  namespace: monitoring
spec:
  jobName: photoprism
  interval: 60s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter:9115
    path: /probe
  targets:
    staticConfig:
      static:
        # PhotoPrism on the hub. /readyz needs no login and answers 503 until the server has
        # started; it does not check the database. An IP, so a DNS outage is not a PhotoPrism one.
        - http://192.168.0.44:2342/readyz
