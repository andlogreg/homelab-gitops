apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: n8nio/n8n:2.8.2
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
          args:
            - -c
            - sleep 5; n8n start
          envFrom:
            - configMapRef:
                name: n8n
          ports:
            - containerPort: 5678
              name: http
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-claim
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/node/.cache
              name: n8n-cache
            - mountPath: /home/node/.npm
              name: npm-cache
      volumes:
        - name: n8n-claim
          persistentVolumeClaim:
            claimName: n8n-claim
        - name: tmp
          emptyDir: {}
        - name: n8n-cache
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
