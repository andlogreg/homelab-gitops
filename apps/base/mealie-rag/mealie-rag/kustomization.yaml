apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
  - deployment.yaml
  - external-secret.yaml
  - service.yaml

configMapGenerator:
  - name: mealie-rag-config
    literals:
      - DELETE_COLLECTION_IF_EXISTS=true

images:
  - name: ghcr.io/andlogreg/mealierag
    newTag: mealierag-v0.3.0
