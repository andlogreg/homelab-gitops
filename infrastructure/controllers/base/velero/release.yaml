apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  dependsOn:
    - name: external-secrets
      namespace: external-secrets
  interval: 12h
  chart:
    spec:
      chart: velero
      version: 11.3.2
      sourceRef:
        kind: HelmRepository
        name: velero
      interval: 12h
  values:
    # The chart's upgrade-crds hook pulls docker.io/bitnamilegacy/kubectl:1.36,
    # which no longer exists (Bitnami legacy-image migration) and blocks install.
    # CRDs are installed by the chart's crds/ dir on first install, so the hook
    # is redundant here. Disable it; revisit if bumping the chart needs CRD upgrades.
    upgradeCRDs: false
    # Deliberately NO `annotations: {secret.reloader.stakater.com/reload: velero-backup-creds}`
    # here, even though the chart's values.yaml advertises exactly that. Velero does not need it:
    # both the server and the node-agent re-read /credentials/cloud every time they initialise the
    # object store, which BackupStorageLocation validation does about once a minute and kopia does
    # per PodVolumeBackup. Verified with a real storage-account key rotation: the BSL went
    # Unavailable and recovered to Available in ~90s (that lag is kubelet refreshing the mounted
    # secret file, not Velero), and a backup then completed - with neither pod restarting.
    # Adding the annotation would only buy an unnecessary restart of the backup path.
    credentials:
      existingSecret: velero-backup-creds  # pragma: allowlist secret
    snapshotsEnabled: false
    deployNodeAgent: true
    configuration:
      logFormat: json
      backupStorageLocation:
        - name: default
          provider: velero.io/azure
          bucket: velero-backups
          # Per-cluster-generation prefix: each rebuild bumps VELERO_BSL_PREFIX
          # (e.g. phoenix-production-g1 -> -g2) so a fresh cluster writes under a clean
          # prefix and its TTL-GC can never delete the previous generation's backups.
          # Seeded in the flux-system/velero-backup-creds substitution secret at bootstrap;
          # empty default keeps clusters without the seed on the container root.
          prefix: "${VELERO_BSL_PREFIX:=}"
          config:
            storageAccount: "${STORAGE_ACCOUNT_NAME}"
            storageAccountURI: "https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net"
            storageAccountKeyEnvVar: "AZURE_STORAGE_ACCOUNT_ACCESS_KEY"  # pragma: allowlist secret
    initContainers:
      - name: velero-plugin-for-microsoft-azure
        image: velero/velero-plugin-for-microsoft-azure:v1.13.0
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins
