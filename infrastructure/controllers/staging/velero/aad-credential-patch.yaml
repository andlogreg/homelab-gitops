# Move this cluster's Velero onto a container-scoped Entra identity, ahead of the other clusters.
#
# TRANSITIONAL. Once every cluster is cut over, fold these two settings into the base HelmRelease
# and delete this patch.
#
# Velero picks its storage credential in this order: storageAccountKeyEnvVar wins if set, else
# useAAD, else it exchanges the Entra credential for the storage account key via an ARM listKeys
# call. That last path is worse than the key it replaces — the same key, plus an ARM permission —
# so the removal and the useAAD must land together, which is why they are one patch.
#
# The value is quoted because BackupStorageLocation.spec.config is map[string]string and an
# unquoted true is a YAML boolean the API server will reject. Do not parameterise this through
# Flux postBuild substitution: substitution rewrites already-serialised YAML, by which point
# kustomize has dropped the quotes, and "true" silently becomes a boolean again.
- op: remove
  path: /spec/values/configuration/backupStorageLocation/0/config/storageAccountKeyEnvVar
- op: add
  path: /spec/values/configuration/backupStorageLocation/0/config/useAAD
  value: "true"
