apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: qdrant
spec:
  interval: 12h
  targetNamespace: mealie-rag
  chart:
      spec:
          chart: qdrant
          version: '1.20.0'
          sourceRef:
              kind: HelmRepository
              name: qdrant
          interval: 12h
  values:
    # Requests from 10 days of measured usage (Oct 2026); no limits on purpose.
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
