[tools]
cloudflared = "latest"
python = "3.14.7"        # pre-commit is a Python app; make the hook toolchain self-contained
pre-commit = "latest"
flux2 = "latest"
k3d = "latest"
k9s = "latest"
# Pinned, not "latest": Terraform stamps its own version into every state file it
# writes, and an older binary refuses to read state written by a newer one. An
# unpinned version let two machines drift apart until one could no longer read the
# state the other had written. Bump deliberately, on all machines.
terraform = "1.14"
velero = "latest"      # CLI for operating/verifying Velero backups on the phoenix clusters
azure-cli = { version = "latest", uvx_args = "--prerelease=allow" }

[settings]
experimental = true
# Never build CPython from source here; always take the prebuilt standalone release.
# A source build silently DROPS optional stdlib modules whose headers are missing
# rather than failing: bumping python 3.14.6 -> 3.14.7 compiled locally (no
# libsqlite3-dev in the devcontainer) and produced a Python with no `_sqlite3`,
# which broke `pre-commit` - the one thing this python pin exists to run - while
# reporting a clean install. The prebuilt releases bundle sqlite, so the same
# version installs complete. This is why 3.14.6 worked and 3.14.7 did not: 3.14.6
# had been fetched prebuilt, 3.14.7 was compiled.
python.compile = false

[hooks]
enter = "bash ./scripts/setup_project"

[tasks.k8s-local-setup]
description = "Set up a local k8s cluster for quickly testing WIP changes"
run = "bash ./scripts/setup_cluster_local"
