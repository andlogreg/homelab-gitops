repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Secret scanning — gitleaks (unified with homelab-infra).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  # Structural guard: no committed Kubernetes Secret payload. Secrets live in Azure
  # Key Vault and are pulled in via ExternalSecret — git holds references, never data.
  - repo: local
    hooks:
      - id: no-committed-secret-payload
        name: no committed Secret data/stringData
        entry: python scripts/check_no_secret_payload.py
        language: python
        additional_dependencies: [pyyaml]
        files: \.ya?ml$
        exclude: \.example$
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.11.1
    hooks:
      - id: commitizen
