apiVersion: v1
kind: ConfigMap
metadata:
  name: kernel-module-params
data:
  # Idle-power tuning for the RTX 4090, now measured rather than assumed.
  #
  # Method: 10-minute windows, nvidia-smi power.draw sampled every 5 s, GPU workloads
  # scaled to zero, card at P8 / 210 MHz / 1 MiB VRAM / 36-40 C in every window.
  # Corroborated independently by DCGM_FI_DEV_POWER_USAGE in Prometheus and by a
  # wall-socket meter on the host. Results:
  #
  #   module        GSP  Preserve  S0ix    GPU idle   at the wall
  #   proprietary    1      1        0      12.5 W      128.9 W   <- this config
  #   proprietary    1      1        1      13.9 W      128.2 W
  #   proprietary    1      0        1      25.1 W      144.5 W
  #   proprietary    1      0        0      26.0 W      143.9 W   (driver defaults)
  #   proprietary    0      1        1      26.5 W      142.7 W
  #   open           1      1        1      26.5 W      143.3 W
  #
  # Two things worth carrying away:
  #
  #   - Low idle is a three-way AND: proprietary module AND GSP AND
  #     PreserveVideoMemoryAllocations. Remove any single one and it returns to
  #     ~25-26.5 W. That is why these are set together and must be changed together.
  #   - NVreg_EnableS0ixPowerManagement used to be set here and has been REMOVED. It
  #     governs s2idle system suspend, which this always-running server VM never
  #     performs, and the measurement found no benefit (13.9 W with it, 12.5 W without).
  #     It was doing nothing.
  #
  # The open kernel module is NOT a drop-in here: it loads GSP correctly and passes a
  # GPU smoke test, but idles at 26.5 W - it never reaches the low-power state. See the
  # note on driver.kernelModuleType in release.yaml for that trade-off.
  #
  # WARNING - editing this file alone does NOT change anything on the node. The driver
  # container reloads the kernel module only when the operator-computed
  # DRIVER_CONFIG_DIGEST differs from /run/nvidia/nvidia-driver.state. That digest is
  # derived from the ClusterPolicy driver spec, NOT from the contents of this ConfigMap,
  # so a params-only edit is silently ignored and the container logs "The NVIDIA driver
  # is already loaded with the desired configuration, performing userspace-only install".
  # To apply a change here without also changing the driver spec:
  #     sudo rm -f /run/nvidia/nvidia-driver.state          # on the node
  #     kubectl rollout restart ds/nvidia-driver-daemonset -n gpu-operator
  # Then VERIFY against /proc/driver/nvidia/params inside the driver container - never
  # against this ConfigMap, which proves only what was requested, not what is in force.
  # A cold boot loads the module fresh, so these values are always in force after one.
  #
  # Only helios consumes this base, so the blast radius is the lab cluster.
  nvidia.conf: |
    NVreg_PreserveVideoMemoryAllocations=1
    NVreg_EnableGpuFirmware=1
