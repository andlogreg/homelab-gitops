apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie
resources:
  - ../../base/mealie
  - external-secret-openai.yaml

configMapGenerator:
  - name: mealie-config
    behavior: merge
    literals:
      # - OPENAI_MODEL=gemma3:12b
      - OPENAI_ENABLE_IMAGE_SERVICES=True

patches:
  - path: velero_backup_patch.yaml
  # This overlay runs the -01 generation of the cluster (see generation_patch.yaml).
  - path: generation_patch.yaml
    target:
      kind: Cluster
      name: mealie-db-00
  - path: references_patch.yaml
  - target:
      kind: Deployment
      name: mealie
    patch: |- # pragma: allowlist secret
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: mealie-openai-secret
