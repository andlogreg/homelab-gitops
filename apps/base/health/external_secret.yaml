apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-db-credentials
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: health-db-00-app
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: "{{ .password }}"
        pgpass: "health-db-00-rw:5432:health:health:{{ .password }}"
        jdbc-uri: "jdbc:postgresql://health-db-00-rw.health:5432/health?password={{ .password }}&user=health"
        uri: "postgresql://health:{{ .password }}@health-db-00-rw.health:5432/health"
  data:
  - secretKey: password # pragma: allowlist secret
    remoteRef:
      key: health-db-credentials-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-db-objectstore
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: cnpg-backup-creds
  data:
  # The ObjectStore authenticates with the container-scoped Entra identity below. barman resolves
  # it through DefaultAzureCredential, whose first step reads exactly these three variables; they
  # are injected into the sidecar as env, not read from here by name.
  #
  # THREE KEYS ONLY, deliberately. The equivalent secret in the older Postgres namespaces also
  # carries the storage account name and key, left over from a frozen recovery ObjectStore that is
  # the last consumer of shared-key auth on that account. This namespace has no such history, so it
  # starts without them -- there is no reason to hand a new workload a credential that an open task
  # exists to delete.
  - secretKey: AZURE_CLIENT_ID
    remoteRef:
      key: azure-backup-cnpg-client-id
  - secretKey: AZURE_TENANT_ID
    remoteRef:
      key: azure-tenant-id
  - secretKey: AZURE_CLIENT_SECRET # pragma: allowlist secret
    remoteRef:
      key: azure-backup-cnpg-client-secret
