apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 12h
  chart:
    spec:
      chart: gpu-operator
      # v26.3.3 is the first supported major for helios's Kubernetes 1.36.
      # Proved against the passed-through RTX 4090 in TASK-7.4 before taking it.
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: gpu-operator
      interval: 12h
  values:
    toolkit:
      env:
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
    dcgmExporter:
      serviceMonitor:
        enabled: true
        interval: 15s
        honorLabels: true
    driver:
      # v26.3.3's default 580.126.20 image omitted the Ada GSP firmware on
      # helios (TASK-7.4 evidence: RmFetchGspRmImages failed). 580.173.02 is
      # NVIDIA's recommended v26.3.3 driver and keeps the Operator on its
      # Kubernetes-1.36-supported release.
      version: "580.173.02"
      # kernel module configuration for NVIDIA driver
      kernelModuleConfig:
        name: "kernel-module-params"
    devicePlugin:
      config:
        name: time-slicing-config
        default: any
