apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  annotations:
    # TUNNEL_TOKEN is an env var from a secretKeyRef, and kubelet never
    # hot-reloads those. Rotating the token without a restart is the worst shape
    # of this problem: the tunnel keeps running on a credential that has already
    # been revoked at Cloudflare, and only drops when something restarts it.
    # Two replicas, so the reload rolls with no gap in the tunnel.
    secret.reloader.stakater.com/reload: "cloudflared-tunnel-token" # pragma: allowlist secret
spec:
  replicas: 2
  selector:
    matchLabels:
      pod: cloudflared
  template:
    metadata:
      labels:
        pod: cloudflared
    spec:
      # securityContext:
      #   sysctls:
      #   # Allows ICMP traffic (ping, traceroute) to resources behind cloudflared.
      #     - name: net.ipv4.ping_group_range
      #       value: "65532 65532"
      containers:
        - image: cloudflare/cloudflared:latest
          name: cloudflared
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel-token
                  key: token
          command:
            - cloudflared
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          # Guards the aggressive liveness probe below, which kills the pod on a single
          # failed check. Now that a rollout waits for readiness, a tunnel that is slow to
          # connect could restart-loop rather than just be slow; a startupProbe suspends
          # liveness until it passes.
          startupProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              # Cloudflared has a /ready endpoint which returns 200 if and only if
              # it has an active connection to Cloudflare's network.
              path: /ready
              port: 2000
            failureThreshold: 1
            periodSeconds: 10
          # The same endpoint, used for readiness too, so a rollout waits for a connected
          # tunnel rather than a started process. No Service fronts these pods - the tunnel
          # dials outbound - so this affects rollout reporting, not traffic. Two replicas
          # stay on the default RollingUpdate so the reload keeps rolling with no gap.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
          - name: config
            mountPath: /etc/cloudflared/config
            readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
            items:
            - key: config.yaml
              path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - hostname: links.andlogreg.work
      service: http://littlelink:3000
    - hostname: links.andlogreg.work
      service: hello_world
    # This rule matches any traffic which didn't match a previous rule, and responds with HTTP 404.
    - service: http_status:404
