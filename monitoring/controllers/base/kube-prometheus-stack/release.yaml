apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 12h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "80.x"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    grafana:
      adminPassword: whoami # pragma: allowlist secret
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.andlogreg.work
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
    prometheus:
      prometheusSpec:
        # Prometheus find all ServiceMonitors regardless of labels
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        # Prometheus find ServiceMonitors in all namespaces
        serviceMonitorNamespaceSelector: {}
        # Same for ScrapeConfig + PrometheusRule CRDs, so configs/* manifests
        # (e.g. static external scrape targets, custom alerts) are picked up.
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeConfigSelector: {}
        scrapeConfigNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        # Tame writes onto the low-endurance host SSDs: a 60s scrape/eval interval
        # roughly halves ingest vs the 30s default, and bound the ephemeral TSDB.
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 10d
        retentionSize: 8GiB
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeApiServer:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeControllerManager: false
    kubelet:
      serviceMonitor:
        metricRelabelings:
          # Reduce bucket cardinality of kubelet storage operations.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          - sourceLabels: [__name__]
            regex: "apiserver_.*"
            action: drop
          - sourceLabels: [__name__]
            regex: "etcd_.*"
            action: drop
