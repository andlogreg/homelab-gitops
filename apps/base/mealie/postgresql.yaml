apiVersion: postgresql.cnpg.io/v1
kind: Cluster
# BACKUP GENERATION CONVENTION: the `-NN` suffix is the backup generation. The barman
# plugin uses the Cluster name as the serverName, so each generation gets its own dir
# under `cnpg-backups/mealie/<mealie-db-NN>/`. On every cluster REBUILD, bump NN
# (-00 -> -01 -> ...) so the fresh cluster cannot overwrite the previous generation's
# WAL/base, and point recovery's externalCluster serverName at the prior NN (see
# apps/production/mealie/recovery.yaml for the -00 -> -01 recovery). Never reuse a
# retired NN; prune a retired serverName dir only after the new generation is healthy.
metadata:
  name: mealie-db-00
spec:
  instances: 1

  bootstrap:
    initdb:
      database: mealie

  # bootstrap:
  #   recovery:
  #     source: mealie-db-backup
  #     database: mealie

  # externalClusters:
  #   - name: mealie-db-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: mealie-db-objectstore
  #         serverName: mealie-db-00

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mealie-db-objectstore
