apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ollama
  - open-webui
  # TEMPORARY, and it must be reverted -- the sibling comment on the replica patch in
  # ollama/kustomization.yaml is the other half of this manoeuvre. Deployed only for a
  # like-for-like comparison against the runtime above, on the one GPU this host has. When the
  # comparison is finished this line is commented out again rather than left running: with
  # pruning on, removing it from this list garbage-collects the namespace, the deployment and
  # the volume together, which is the intended clean-up.
  #
  # The overlay it points at is worth reading before touching: every flag in it is annotated
  # with what that flag actually cost or bought when measured on this card, including the two
  # settings whose defaults do not work here. Enabling it means paying the ~21 GB model
  # download again, which is the least reliable step in the whole bring-up.
  - vllm
