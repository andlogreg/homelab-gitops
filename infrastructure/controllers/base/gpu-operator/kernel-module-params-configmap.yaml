apiVersion: v1
kind: ConfigMap
metadata:
  name: kernel-module-params
data:
  # These three parameters were originally set TOGETHER as a power-management tuning
  # exercise on the RTX 4090, which took measured idle draw from ~25-30 W to ~9 W.
  # NVreg_EnableGpuFirmware was 1 in that work, chosen deliberately, on the reasoning
  # that GSP handles power management on-die.
  #
  # It is now 0, which REVERSES that choice. Be aware of what that does and does not
  # mean before touching it:
  #
  #   - GSP is the driver DEFAULT for Turing and later, so the original `=1` only
  #     re-asserted the default. Flipping it to 0 is therefore not a symmetric edit:
  #     it actively opts out of the default path, where `=1` opted into nothing.
  #   - The open kernel modules REQUIRE GSP and cannot load without it, so
  #     `=0` is what forces driver.kernelModuleType=proprietary in release.yaml. The
  #     two settings are one decision, not two.
  #   - Whether idle draw actually regressed is UNMEASURED. The likeliest reading is
  #     that most of the saving came from the other two parameters, but that is a
  #     hypothesis, and NVIDIA's docs make no claim either way. One command settles
  #     it: `nvidia-smi --query-gpu=power.draw --format=csv` on an idle GPU.
  #
  # Why it was flipped at all: the v26 driver images could not load Ada GSP firmware
  # (RmFetchGspRmImages). The ROM BAR was verified present, so the fault was not the
  # passthrough - but that only rules out one cause. NVIDIA documents this error
  # shape as a driver-container firmware-MOUNT problem (the container cannot reach
  # /lib/firmware and the firmware_class search path), which would make the current
  # state a symptom fix. That is being investigated; if it resolves, restore
  # NVreg_EnableGpuFirmware=1 and the open module together and re-measure idle draw.
  #
  # Only helios consumes this base, so the blast radius is the lab cluster.
  nvidia.conf: |
    NVreg_PreserveVideoMemoryAllocations=1
    NVreg_EnableS0ixPowerManagement=1
    NVreg_EnableGpuFirmware=0
