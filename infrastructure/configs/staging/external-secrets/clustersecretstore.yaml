apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-secret-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "${VAULT_URL}"
      # ESO exchanges this ServiceAccount's projected token for a Key Vault token —
      # no stored client secret. client-id + tenant-id come from the SA annotations
      # (do not also set tenantId here — ESO rejects a duplicate tenant source).
      # Requires the cluster OIDC issuer + an Azure federated credential trusting
      # external-secrets/eso-azure-wi.
      serviceAccountRef:
        name: eso-azure-wi
        namespace: external-secrets
