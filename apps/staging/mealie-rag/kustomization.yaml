apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie-rag
resources:
  - ../../base/mealie-rag
  - ingress.yaml

configMapGenerator:
  - name: mealie-rag-config
    behavior: merge
    literals:
      - MEALIE_API_URL=http://mealie.mealie.svc.cluster.local:9000/api/recipes
      - MEALIE_EXTERNAL_URL=http://mealie-staging.andlogreg.work
      - QDRANT_URL=TBD
      - OLLAMA_BASE_URL=http://ollama-helios.andlogreg.work
      - LLM_MODEL=gemma3:12b
