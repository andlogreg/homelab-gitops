apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mealie-rag
resources:
  - ../../base/mealie-rag
  - ingress.yaml

patches:
  - path: external-secret.yaml
  - target:
      kind: Deployment
      name: mealie-rag
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always

images:
  - name: ghcr.io/andlogreg/mealierag
    newTag: feat-improve-retrieve

configMapGenerator:
  - name: mealie-rag-config
    behavior: merge
    literals:
      - LLM_MODEL=mealie-rag-llm-production
      - EMBEDDING_MODEL=mealie-rag-embedding-production
      - TRACING_ENVIRONMENT=production
