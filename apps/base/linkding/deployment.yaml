apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  annotations:
    # linkding-credentials arrives via envFrom, and kubelet never hot-reloads
    # env vars sourced from a secret - so a rotated superuser credential would
    # sit in the cluster unread until something happened to restart the pod.
    # Single replica, so this is a few seconds of downtime; the credential is
    # re-read cleanly on start, which is what makes it safe to automate.
    secret.reloader.stakater.com/reload: "linkding-credentials" # pragma: allowlist secret
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate: LD_DB_ENGINE=sqlite, so the database is
  # a file on the RWO local-path PVC (/etc/linkding/data/db.sqlite3, plus tasks.sqlite3)
  # and Django migrates it at startup. A rolling update at one replica would run the old
  # pod against a schema the new pod is in the middle of changing.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.45.0
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: linkding-config
            - secretRef:
                name: linkding-credentials
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
          # /health, not /. The root path answers 302 (a redirect to the login page), and an
          # httpGet probe counts any 2xx or 3xx as success - so a probe on / would pass
          # while the app was still unusable. /health returns a plain 200 once it serves.
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data
