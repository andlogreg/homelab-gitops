apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db-00
spec:
  instances: 1

  bootstrap:
    initdb:
      database: litellm

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: litellm-db-objectstore
