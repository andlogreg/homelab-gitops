apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate: DB_TYPE is sqlite3, so the database is a
  # file on an RWO local-path PVC and migrates at startup. Nothing fences that volume on a
  # single node, so a rolling update would put two versions on the same file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: forgejo
        image: data.forgejo.org/forgejo/forgejo:14.0.5-rootless
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: USER_UID
          value: "1000"
        - name: USER_GID
          value: "1000"
        envFrom:
        - configMapRef:
            name: forgejo-config
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 2222
          name: ssh
          protocol: TCP
        # A startupProbe replaces what initialDelaySeconds: 60 used to do on the two probes
        # below. The old shape was a lenient readiness probe: it could not report Ready
        # before 60s no matter how fast the app came up, and with periodSeconds: 90 it could
        # take another 90s to notice. Worse, a start that was genuinely stuck just kept
        # being retried. A startupProbe polls quickly, gives up after a bounded 450s, and
        # suspends the other two probes until it passes - so a stuck start fails the rollout
        # instead of hanging, and a fast start is reported as soon as it is true. The budget
        # is a ceiling rather than an estimate: it has to hold when a shared-base edit
        # restarts every app on the node together.
        startupProbe:
          httpGet:
            path: /api/healthz
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 90
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/healthz
            port: 3000
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/healthz
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/lib/gitea
          name: forgejo-data
        - mountPath: /etc/gitea
          name: forgejo-config
      # initContainers:
      # - command:
      #   - sh
      #   - -c
      #   - chown -R 1000:1000 /etc/gitea
      #   image: busybox:1.37
      #   name: fix-permissions
      #   securityContext:
      #     runAsUser: 0
      #   volumeMounts:
      #   - mountPath: /etc/gitea
      #     name: forgejo-config
      volumes:
      - name: forgejo-data
        persistentVolumeClaim:
          claimName: forgejo-data
      - name: forgejo-config
        persistentVolumeClaim:
          claimName: forgejo-config
