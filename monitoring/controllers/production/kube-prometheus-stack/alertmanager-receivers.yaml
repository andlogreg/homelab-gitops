---
# Production is the only cluster with a live Alertmanager receiver: it is the
# always-on plane, so an alert here means the household is affected. The other
# clusters stay UI-only (Alertmanager/Grafana) on purpose - staging carries
# standing alerts by design and would only train us to ignore the channel.
#
# Policy is deny-by-default: the root route drops everything into the "null"
# receiver, and only the child routes below reach a phone.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  values:
    prometheus:
      prometheusSpec:
        # Every notification says which cluster it came from.
        externalLabels:
          cluster: phoenix-production
    alertmanager:
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-telegram/<key>.
        # NOTE: the pod will not start until this Secret exists, so on a
        # from-scratch bootstrap Alertmanager waits in ContainerCreating until
        # ESO has synced it. It self-heals on the kubelet's mount retry.
        secrets:
          - alertmanager-telegram
      config:
        global:
          resolve_timeout: 5m
        templates:
          - /etc/alertmanager/config/*.tmpl
        route:
          group_by: ['alertname', 'namespace']
          # A minute of grouping turns a node reboot into one message
          # instead of a burst of them.
          group_wait: 1m
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'null'
          routes:
            # Dead-man's switch. Watchdog fires permanently by design, so an
            # external monitor that STOPS receiving pings is the only thing that
            # can tell us the whole cluster (and with it, this Alertmanager) is
            # gone. Must ping well inside the monitor's grace period.
            - receiver: deadmansswitch
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              # repeat_interval is only re-evaluated on group_interval ticks, so
              # 5m/5m lands a ping every ~10m and the monitor sits permanently
              # late. A 1m group_interval makes the 5m repeat mean 5m.
              group_interval: 1m
              repeat_interval: 5m
            # Slow burn by nature - worth knowing about, not worth an hourly
            # nag. Routed explicitly because it is a warning, not a critical.
            - receiver: telegram
              matchers:
                - alertname = "SsdWearHigh"
              repeat_interval: 24h
            # HELD BACK ON PURPOSE, and this route must stay ABOVE the severity
            # one to have any effect - Alertmanager takes the first matching
            # child route and stops.
            #
            # These three are genuinely critical and are labelled honestly as
            # such, because severity should describe how bad a thing is, not
            # which channel it happens to use. What is scoped for now is backup
            # failure and staleness only; everything else stays UI-visible.
            # Keeping the severity truthful and suppressing delivery here means
            # PROMOTING one of them to a page is deleting a name from this list,
            # not re-labelling a rule and re-reasoning about what critical means.
            - receiver: 'null'
              matchers:
                - alertname =~ "ProxmoxHostFilesystemAlmostFull|ProxmoxHostFilesystemReadOnly|CloudflaredTunnelDown"
            # Not listed above and therefore NOT paging yet, because it is
            # permanently firing: KubeJobFailed has been standing on this cluster
            # since the mealie-rag nightly ingest started failing every run. It
            # is a warning, so the severity route below does not reach it, and it
            # must stay that way until that job is fixed - wiring it first would
            # deliver a permanent page on day one, which is the precise mistake
            # KubeProxyDown taught us to check for.
            - receiver: telegram
              matchers:
                - severity = "critical"
              repeat_interval: 12h
        receivers:
          - name: 'null'
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                # Read from the mounted secret like the token, so the id stays out
                # of this public repo. Needs Alertmanager >= 0.31; below that the
                # operator drops the field and then rejects the config for having
                # neither chat_id nor chat_id_file. The two are mutually exclusive.
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                # parse_mode is left unset, which means Telegram's default of
                # HTML. That is fine and in fact the safer mode: for HTML
                # Alertmanager renders the message with html/template, so alert
                # text is escaped automatically. (Selecting plain text is not
                # possible here anyway - Helm strips an explicit empty string
                # when coalescing values, so the key never reaches the config.)
                message: '{{ template "telegram.homelab.message" . }}'
                send_resolved: true
          - name: deadmansswitch
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-telegram/healthchecks-url
                send_resolved: false
      templateFiles:
        telegram.tmpl: |-
          {{/* Do NOT escape interpolated values here. Telegram messages are sent
               with parse_mode HTML, and for HTML Alertmanager renders this
               template with html/template, which already escapes anything that
               came from an alert. Escaping by hand double-escapes it and the
               reader sees literal &lt; and &amp;. Markup written in the template
               itself, like <b> below, is still treated as markup. */}}
          {{ define "telegram.homelab.message" }}
          {{- if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} — {{ if .CommonLabels.cluster }}{{ .CommonLabels.cluster }}{{ else }}homelab{{ end }}
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
          {{- with .Annotations.summary }}
          {{ . }}
          {{- end }}
          {{- with .Annotations.description }}
          {{ . }}
          {{- end }}
          {{- with .Labels.namespace }}
          namespace: {{ . }}
          {{- end }}
          {{- with .Labels.instance }}
          instance: {{ . }}
          {{- end }}
          {{- with .Annotations.runbook_url }}
          runbook: {{ . }}
          {{- end }}
          {{ end }}
          {{- end }}
