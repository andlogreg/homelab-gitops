apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate: open-webui's database is SQLite on the
  # RWO local-path PVC (/app/backend/data/webui.db) and it migrates at startup, so a
  # rolling update at one replica would have two versions on the same file at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.10.2
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: open-webui-config
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
          # 5s x 90 = 450s. Open WebUI's first boot after an image change can spend minutes
          # initialising before it answers, which is precisely the window that used to be
          # reported as Ready. /health is a plain 200 once it serves; /health/db also
          # exists but is left to monitoring rather than used to gate the endpoint.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
