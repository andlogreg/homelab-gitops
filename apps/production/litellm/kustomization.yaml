apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - ../../base/litellm
  - ingress.yaml

patches:
  - path: external-secret.yaml

configMapGenerator:
  - name: litellm-config
    behavior: merge
    files:
      - config.yaml
    literals:
      - LANGFUSE_TRACING_ENVIRONMENT=production
