apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - ../../base/litellm
  - ingress.yaml

patches:
  - path: external-secret.yaml
  # This overlay runs the -01 generation of the cluster (see generation_patch.yaml).
  - path: generation_patch.yaml
    target:
      kind: Cluster
      name: litellm-db-00
  - path: references_patch.yaml

configMapGenerator:
  - name: litellm-config
    behavior: merge
    files:
      - config.yaml
    literals:
      - LANGFUSE_TRACING_ENVIRONMENT=production
