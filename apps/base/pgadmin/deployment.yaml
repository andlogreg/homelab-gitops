apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate: pgadmin keeps its own SQLite config
  # database on the RWO local-path PVC (/var/lib/pgadmin) and upgrades its schema on start.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9.17
          ports:
            - containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: "admin@admin.com"
            - name: PGADMIN_DEFAULT_PASSWORD
              value: "admin"
            - name: PGADMIN_LISTEN_PORT
              value: "80"
            - name: PGADMIN_REPLACE_SERVERS_ON_STARTUP
              value: "True"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
            - name: servers-conf
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
          # /misc/ping returns a plain 200 ("PING"). The root path is a 302 to the login
          # page, and httpGet treats a 3xx as success, so probing / would pass too early.
          # Port follows PGADMIN_LISTEN_PORT above.
          startupProbe:
            httpGet:
              path: /misc/ping
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /misc/ping
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-data
        - name: servers-conf
          configMap:
            name: pgadmin-servers
