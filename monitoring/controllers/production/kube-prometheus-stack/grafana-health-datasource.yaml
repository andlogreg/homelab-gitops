apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  values:
    grafana:
      annotations:
        # The datasource password is an env var, and kubelet does not update a
        # running process when its Secret changes. Restart only Grafana when
        # this one credential rotates; the datasource reconnects with the new
        # value on startup.
        secret.reloader.stakater.com/reload: "health-db-grafana" # pragma: allowlist secret
      envValueFrom:
        HEALTH_DB_GRAFANA_PASSWORD:
          secretKeyRef:
            name: health-db-grafana
            key: password
