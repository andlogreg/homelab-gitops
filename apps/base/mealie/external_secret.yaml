apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-db-credentials
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: mealie-db-00-app
    creationPolicy: Merge
    deletionPolicy: Merge
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        password: "{{ .password }}"
        pgpass: "mealie-db-00-rw:5432:mealie:mealie:{{ .password }}"
        jdbc-uri: "jdbc:postgresql://mealie-db-00-rw.mealie:5432/mealie?password={{ .password }}&user=mealie"
        uri: "postgresql://mealie:{{ .password }}@mealie-db-00-rw.mealie:5432/mealie"
  data:
  - secretKey: password # pragma: allowlist secret
    remoteRef:
      key: mealie-db-credentials-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-creds
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: cnpg-backup-creds
  data:
  # The live ObjectStore authenticates with the container-scoped Entra identity below. barman
  # resolves it through DefaultAzureCredential, whose first step reads exactly these three
  # variables; they are injected into the sidecar as env, not read from here by name.
  - secretKey: AZURE_CLIENT_ID
    remoteRef:
      key: azure-backup-cnpg-client-id
  - secretKey: AZURE_TENANT_ID
    remoteRef:
      key: azure-tenant-id
  - secretKey: AZURE_CLIENT_SECRET # pragma: allowlist secret
    remoteRef:
      key: azure-backup-cnpg-client-secret
