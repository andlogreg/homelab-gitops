apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-secret-store
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "${VAULT_URL}"
      # ESO exchanges this ServiceAccount's projected OIDC token for a Key Vault
      # token. Client ID and tenant come from the SA annotations; do not also set
      # tenantId here, because ESO rejects duplicate tenant sources.
      serviceAccountRef:
        name: eso-azure-wi
        namespace: external-secrets
