apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app: litellm
spec:
  # Recreate rather than the default RollingUpdate. No PVC here, but litellm migrates its
  # schema on the shared database at startup, and a rolling update at one replica keeps the
  # old pod serving against that schema for the whole migration. Worth naming the tradeoff
  # being given up: the overlap has been useful once, when a bad rotated credential made the
  # new pod fail to start and the old one carried on serving - a stuck rollout instead of an
  # outage. A short, honest outage is the preferred failure here.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
      - name: litellm
        image: docker.litellm.ai/berriai/litellm:v1.83.14-stable
        args:
          - "--config"
          - "/app/proxy_server_config.yaml"
        ports:
        - containerPort: 4000
        volumeMounts:
        - name: config-volume
          mountPath: /app/proxy_server_config.yaml
          subPath: config.yaml
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-db-00-app
              key: uri
        envFrom:
          - configMapRef:
              name: litellm-config
          - secretRef:
              name: litellm-secrets
        # Replaces initialDelaySeconds: 120 on both probes below. That delay meant every
        # rollout took at least two minutes even when the app was serving in ten seconds,
        # and a genuinely stuck start was retried rather than failed. The startupProbe polls
        # every 5s, gives up after a bounded 450s, and holds the other two probes off until
        # it passes. The budget bounds a stuck start rather than estimating a normal one, so
        # it stays generous enough for a shared-base edit restarting everything at once.
        startupProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          periodSeconds: 5
          timeoutSeconds: 10
          failureThreshold: 90
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 30
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 3
          timeoutSeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: litellm-config
