apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 12h
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pin exactly, like every other chart here. A range pin looks like it keeps
      # itself current and does the opposite: it hides which version is actually
      # deployed, and Renovate leaves it alone because the resolved version still
      # satisfies the range. This one sat seven majors behind before anyone noticed.
      version: "87.19.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  # https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
  values:
    grafana:
      adminPassword: whoami # pragma: allowlist secret
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.prod.andlogreg.work
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
          isDefault: false
    prometheus:
      prometheusSpec:
        # Prometheus find all ServiceMonitors regardless of labels
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        # Prometheus find ServiceMonitors in all namespaces
        serviceMonitorNamespaceSelector: {}
        # PodMonitors were the odd one out: this selector sat at the chart default
        # (matchLabels release=kube-prometheus-stack) while the other three were
        # relaxed to {}. That asymmetry is a landmine, because a PodMonitor
        # generated by some OTHER chart cannot be given that label - CNPG's
        # `monitoring.enablePodMonitor` and Velero's `nodeAgentPodMonitor` both
        # emit one, and both would have been silently never scraped. A PodMonitor
        # that matches nothing looks exactly like one that is working.
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        # Same for ScrapeConfig + PrometheusRule CRDs, so configs/* manifests
        # (e.g. static external scrape targets, custom alerts) are picked up.
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeConfigSelector: {}
        scrapeConfigNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        # Probe was the LAST selector still sitting at the chart default, and it
        # bit exactly as the PodMonitor comment above predicts. The HomeAssistant
        # Probe applied cleanly, `kubectl get probe` listed it, Flux reported the
        # Kustomization healthy - and Prometheus scraped it zero times, because
        # this selector still demanded release=kube-prometheus-stack. An object
        # that matches nothing is indistinguishable from one that is working;
        # the only thing that catches it is querying for the series it should
        # be producing.
        probeSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeNamespaceSelector: {}
        # Tame writes onto the low-endurance host SSDs: a 60s scrape/eval interval
        # roughly halves ingest vs the 30s default, and bound the ephemeral TSDB.
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 10d
        retentionSize: 8GiB
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeApiServer:
      enabled: false
    # k3s runs kube-proxy embedded and binds its metrics to localhost, so the
    # chart's :10249 ServiceMonitor can never scrape it -> a permanently firing
    # critical KubeProxyDown. Drop both the scrape target and the rule group.
    kubeProxy:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeControllerManager: false
        kubeProxy: false
    kubelet:
      serviceMonitor:
        metricRelabelings:
          # Reduce bucket cardinality of kubelet storage operations.
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          - sourceLabels: [__name__]
            regex: "apiserver_.*"
            action: drop
          - sourceLabels: [__name__]
            regex: "etcd_.*"
            action: drop
