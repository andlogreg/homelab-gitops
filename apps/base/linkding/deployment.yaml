apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.45.0
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: linkding-config
            - secretRef:
                name: linkding-credentials
          volumeMounts:
            - name: linkding-data
              mountPath: /app/data/
      volumes:
        - name: linkding-data
          persistentVolumeClaim:
            claimName: linkding-data
