# ServiceAccount ESO federates to Azure with (Workload Identity Federation).
# Its projected token is exchanged by ESO for a Key Vault token — no stored client
# secret. The annotations tell ESO which Azure identity to request and in which
# tenant; both are non-secret identifiers, seeded into the eso-vault-config ConfigMap
# out-of-band and substituted here by Flux.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-azure-wi
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: "${ESO_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
