apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ollama
resources:
  - ../../base/ollama

patches:
  - target:
      kind: Deployment
      name: ollama
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ollama
      spec:
        template:
          spec:
            containers:
              - name: ollama
                resources:
                  limits:
                    nvidia.com/gpu: 0 # No GPU
                    cpu: "2"
