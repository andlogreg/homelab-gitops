apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate: the n8n database is SQLite on the RWO
  # local-path PVC (/home/node/.n8n/database.sqlite), and a rolling update at one replica
  # would have the old pod holding that file open while the new pod migrates it. Nothing
  # fences an RWO local-path volume on a single node, so that overlap is unguarded.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: n8n
          image: n8nio/n8n:2.38.3
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
          args:
            - -c
            - sleep 5; n8n start
          envFrom:
            - configMapRef:
                name: n8n
          ports:
            - containerPort: 5678
              name: http
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-claim
            - mountPath: /tmp
              name: tmp
            - mountPath: /home/node/.cache
              name: n8n-cache
            - mountPath: /home/node/.npm
              name: npm-cache
          # Deliberately /healthz/readiness and NOT /healthz. Upstream returns an
          # unconditional ok from /healthz - its own source comments that the main health
          # check "should not care about DB connections" - so /healthz answers happily in
          # the middle of a migration. /healthz/readiness returns 200 only once the
          # database is connected AND migrated AND the app has finished starting, and 503
          # otherwise. Only the second one can tell you the instance is usable.
          #
          # 5s x 90 = 450s of startup budget - a ceiling, not an estimate. A version jump
          # here can be dozens of releases of migrations, the container sleeps 5s before it
          # even starts, and a shared-base edit restarts every app on the node at once.
          startupProbe:
            httpGet:
              path: /healthz/readiness
              port: 5678
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz/readiness
              port: 5678
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: n8n-claim
          persistentVolumeClaim:
            claimName: n8n-claim
        - name: tmp
          emptyDir: {}
        - name: n8n-cache
          emptyDir: {}
        - name: npm-cache
          emptyDir: {}
