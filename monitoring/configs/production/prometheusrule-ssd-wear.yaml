apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ssd-wear
  namespace: monitoring
spec:
  groups:
    - name: ssd-endurance
      rules:
        # Media_Wearout_Indicator is a normalized "life remaining" gauge (100 = new,
        # counts down to 0). <= 20 means ~80% of the drive's rated endurance is used
        # — turn a dead-SSD surprise into a planned swap.
        - alert: SsdWearHigh
          expr: 'smartmon_media_wearout_indicator_value{job="proxmox-node"} <= 20'
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "SSD wear >=80% on {{ $labels.instance }} ({{ $labels.disk }})"
            description: "Media_Wearout_Indicator on {{ $labels.instance }} {{ $labels.disk }} is {{ $value }} (normalized life remaining; <=20 means >=80% of rated endurance consumed). Plan an SSD swap."
