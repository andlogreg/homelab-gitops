apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm
resources:
  - ../../base/vllm/gpu
  - ingress.yaml
  # Kept even though the checkpoint below is ungated: the container's reference to it is
  # optional, so this never blocks a start, and anonymous Hugging Face pulls are rate-limited
  # at the ~21 GB this model weighs.
  - external-secret.yaml

configMapGenerator:
  - name: vllm-config
    literals:
      # A 4-bit AWQ quantization of a dense 27B, chosen because it is the only format that fits
      # a single 24 GB Ada card: BF16 wants an H200 or two H100s, FP8 wants a 40 GB card, and
      # NVFP4 is Blackwell-only and cannot run here at all despite looking like the obvious
      # modern 4-bit pick. Apache-2.0 and ungated, unlike the licence-gated model this overlay
      # used to name, so a from-scratch bring-up cannot fail on a Hugging Face approval step.
      - MODEL_NAME=cyankiwi/Qwen3.8-27B-AWQ-INT4
      # Forces the Hugging Face client off its chunk-deduplicating download path.
      #
      # HONEST STATUS: this is NOT a proven fix, and an earlier version of this comment
      # claimed it was. What is established is only that the model download hangs near
      # completion, and that it does so with the default path. The transfer stops dead with
      # its TLS connections still ESTABLISHED and idle - no error, no timeout, no retry - and
      # it holds the per-blob lock in the cache while hung, so a second downloader cannot get
      # past it either and simply waits behind it. Nothing fails, so nothing recovers.
      #
      # What refutes the simple story: with this variable set, a fresh start ALSO sat at zero
      # bytes on the remaining shard. So the hang is not attributable to the deduplicating
      # path alone. It is also not the network: a plain ranged HTTP request for the very same
      # shard, from inside the very same container, sustained ~50 MiB/s while the client was
      # making no progress at all.
      #
      # The variable is kept because it is harmless and the default path is the one observed
      # hanging twice, not because it has been shown to help. Do not treat a successful
      # bring-up as evidence that it works.
      #
      # If a bring-up hangs here: the recovery that DID work was fetching the missing shard
      # with ranged HTTP requests, verifying it against the checksum that the blob filename
      # already encodes, and placing it in the cache by hand. The checksum makes that
      # verifiable rather than hopeful.
      #
      # The accelerated downloader is a third option and is NOT available: it is not
      # installed in this image, and enabling it by environment variable without the package
      # raises instead of falling back.
      - HF_HUB_DISABLE_XET=1
      # The whole argument string is ONE ConfigMap value, and the surrounding quotes here are
      # YAML's -- they are stripped by the parser and never reach the container. Do not quote
      # the value itself: kustomize splits a literal on its first "=" and keeps the rest
      # verbatim, so an inner pair of quotes becomes part of the value, and the entrypoint's
      # `vllm serve $(MODEL_NAME) $(VLLM_ARGS)` then word-splits `"--gpu-memory-utilization`
      # into a single argument with a leading quote. That fails argparse on the first start,
      # after the multi-gigabyte model download has already been paid for.
      #
      # --language-model-only: this is a vision-language checkpoint and the vision tower is
      #   dead weight for coding -- it is roughly 2B of the parameters, and on a card this
      #   close to full that is the difference between fitting a useful context and not.
      # --kv-cache-dtype fp8: halves the KV cache, which is what actually binds here. Weights
      #   leave only a few GB and the cache is the only elastic consumer left.
      # --enable-prefix-caching: an agent resends the whole conversation with one turn
      #   appended, so nearly every prefill is a repeat of the last one. Without this the
      #   per-turn cost is dominated by re-reading context the server just read.
      # --max-model-len 65536: agentic clients need >=64k and degrade *silently* below it --
      #   the symptom is an agent that loops or forgets its own tool output, not an error.
      #   Matches the context the neighbouring runtime is configured for, so the two are
      #   measurable against each other.
      # --max-num-seqs 4: the default here is 256 concurrent sequences. (Not 1024 - that
      #   figure applies only to GPUs with 70 GiB or more; this card takes the smaller
      #   branch, which also sets a batched-token default of 2048.) This is a HYBRID
      #   linear-attention model, and the runtime allocates per-sequence recurrent state for
      #   every slot up front, whether or not anything uses it -- unlike a KV cache, that cost
      #   does not scale down with short conversations. Measured: the process reached 22.87 GiB
      #   of a 23.52 GiB card before any cache was allocated, against 18.37 GiB of weights,
      #   and it then died allocating 784 MiB for graph capture with 649 MiB free. Dropping
      #   to 4 slots recovered ~1.4 GiB, which is ~5.6 MiB of recurrent state per slot. The
      #   workload here is ONE interactive user, so 1024 slots buy nothing that could ever be
      #   used; the batching those slots exist to serve is exactly the feature that is inert
      #   at a concurrency of one.
      # --enforce-eager: disables CUDA graph capture, and BOTH halves of that trade have now
      #   been measured rather than assumed. Upstream's own configuration for a 32 GB consumer
      #   card sets it too, and that card has more headroom than this one.
      #     What it buys: ~2.6 GiB. Turning capture back on left only 0.14 GiB of token cache,
      #     and the engine refused to start -- it needs 1.29 GiB to hold even a single 32k
      #     conversation. Note where that 2.6 GiB actually goes: only 0.48 GiB is the captured
      #     graph pool; the rest is a much higher profiled activation peak once the model is
      #     compiled (2.95 GiB against 0.39 GiB eager). Calling it "the graph pool" is wrong.
      #     What it costs: ~40% of decode throughput. Measured on the identical prompt, same
      #     card, same checkpoint: 49.7 tok/s with capture on, 29.3 tok/s with it off (short
      #     prompt: 51.2 vs 29.0). That is a real, large penalty and must be reported alongside
      #     any claim about the context window, not quietly enjoyed as if it were free.
      #   The two cannot both be had on 24 GB: capture is affordable only at a window small
      #   enough (16k) that an agentic client then fails outright. That is the actual trade
      #   this card imposes, and it is why the slower option is the one deployed here.
      # --gpu-memory-utilization 0.92: this is the runtime's own default, arrived at the long
      #   way round. It is NOT a fix for a start-up OOM -- it does not change the peak above;
      #   it is the budget the token cache is sized against afterwards, and at 0.90 that budget
      #   (21.2 GiB) sat BELOW what start-up already uses, leaving nothing for a cache at all.
      #   Note the card presents 23.52 GiB to the runtime, not its nominal 24: the driver
      #   context takes the rest.
      #
      #   It was briefly set to 0.97, and that is the interesting part. Start-up succeeded and
      #   reported a token cache big enough for 1.69 full-length conversations -- and then the
      #   server DIED, deterministically, on the first genuinely long prompt (~35k tokens), out
      #   of memory inside the linear-attention prefill kernel. Start-up sizes the cache from a
      #   PROFILED activation peak of 0.39 GiB; a real long prefill actually took ~1.08 GiB.
      #   With 0.97 the whole card was already committed, so that difference had nowhere to
      #   come from. A cache that fits the configured window is not the same claim as a server
      #   that can process it, and only the second one is worth anything.
      #
      #   0.92 keeps the cache comfortably above one full-length conversation while leaving
      #   ~1.2 GiB unclaimed for that transient. Do NOT raise it back to squeeze out more
      #   cache: the headroom IS the feature, and the failure it prevents is a hard crash of
      #   the whole server -- every in-flight request included -- not a slow response.
      # UNVERIFIED AGAINST v0.28.0 - read before the next bring-up. The image tag was taken
      #   from v0.27.1 to v0.28.0 on 2026-08-30 while this overlay was commented out of
      #   ../kustomization.yaml, so NOTHING below has been re-measured on v0.28.0. Every number
      #   in this file was measured on v0.27.1. Three things in that release touch this config:
      #
      #   1. --max-num-batched-tokens: the DEFAULT moved 8192 -> 16384. This overlay deliberately
      #      does not set it (see below), so it silently inherits the doubling. That matters here
      #      specifically: the note on --gpu-memory-utilization records a server that died OOM
      #      inside the linear-attention prefill kernel because a real long prefill took ~1.08 GiB
      #      against a PROFILED peak of 0.39 GiB, and 0.92 leaves only ~1.2 GiB for that
      #      transient. A doubled batched-token budget pushes on exactly that margin. If the
      #      server starts and then dies on the first long prompt, set --max-num-batched-tokens
      #      8192 to restore the old behaviour BEFORE touching --gpu-memory-utilization.
      #   2. reasoning_content output removal is called a breaking CLIENT change. This overlay
      #      runs --reasoning-parser qwen3 and Open WebUI is the client, so that lands on the
      #      contract between them. Test a reasoning request end to end, not just pod readiness.
      #   3. Transformers was bumped to 5.15.0, and bitsandbytes moved out-of-tree. Neither is
      #      referenced here (this is an AWQ-INT4 checkpoint), so both should be inert.
      #
      #   Checked and NOT a problem: the two removed flags, calculate_kv_scales and
      #   override_attention_dtype, appear nowhere in this repo.
      # Deliberately NOT set: --trust-remote-code (this is a third-party quantization, and the
      #   flag executes code from the checkpoint), and --max-num-batched-tokens (the old value
      #   of 1024 throttles prefill hard, which is one of the things being measured).
      # Deliberately NOT set: --speculative-config. It was tried, and it does not fit on this
      #   card at any window -- which is worth recording precisely, because the checkpoint DOES
      #   carry the head and this runtime DOES support driving it, so "unsupported" would be the
      #   wrong lesson. config.json declares one MTP hidden layer and the last shard holds fifteen
      #   mtp.* tensors, left unquantized. Enabling it fails during model load, before the token
      #   cache is sized:
      #
      #     qwen3_5_mtp.py:244, self.lm_head = ParallelLMHead(...)
      #     torch.OutOfMemoryError: Tried to allocate 2.37 GiB; 1.41 GiB free of 23.52 GiB
      #
      #   2.37 GiB is exactly vocabulary 248,320 x hidden 5,120 x 2 bytes -- a full-size head in
      #   bf16. The checkpoint contains exactly ONE lm_head tensor and lists it in the
      #   quantization ignore set, so the target model has already loaded that head unquantized;
      #   the draft builds a SECOND copy of it rather than sharing. There is no mtp lm_head tensor
      #   in the checkpoint at all. The shortfall is about 0.96 GiB.
      #
      #   It is NOT a trade against context, and that is the part worth knowing: the identical
      #   failure -- same line, same allocation, same free bytes -- occurs at --max-model-len 8192.
      #   The window cannot buy it because the failure precedes cache sizing. Fragmentation cannot
      #   either: the same message reports only 58 MiB reserved-but-unallocated. The draft
      #   quantization option was not exercised, because lm_head is in the ignore set and so has
      #   no quantized form to load -- that is reasoning from the checkpoint, not a measurement.
      - 'VLLM_ARGS=--language-model-only --kv-cache-dtype fp8 --enable-prefix-caching --reasoning-parser qwen3 --enable-auto-tool-choice --tool-call-parser qwen3_coder --max-model-len 65536 --max-num-seqs 4 --enforce-eager --gpu-memory-utilization 0.92 --port 8000'

patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: vllm-config
  # Raised from the shared base's 30Gi, which fits exactly one of these checkpoints and nothing
  # else. The StorageClass here has ALLOWVOLUMEEXPANSION=false, so growing this later means
  # deleting the volume and re-downloading everything on it -- the number has to be roomy the
  # first time, and it is free to pick now because the volume does not exist yet. 60Gi holds
  # two ~21 GB checkpoints side by side, which is what comparing them requires.
  - target:
      kind: PersistentVolumeClaim
      name: vllm-data
    patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: vllm-data
      spec:
        resources:
          requests:
            storage: 60Gi
