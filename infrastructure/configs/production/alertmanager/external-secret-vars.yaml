---
# Telegram chat id for the Alertmanager receiver. Not a credential (it is inert
# without the bot token), but it is a personal identifier, so it is kept out of
# this public repo: Key Vault -> this Secret -> Flux postBuild substitution into
# the kube-prometheus-stack values (see clusters/phoenix_production/monitoring.yaml).
#
# The Secret lands in flux-system because that is where Flux resolves
# substituteFrom sources from. The key name IS the substitution variable name.
#
# Alertmanager gained a `chat_id_file` option after the release this chart pins.
# Once the chart is on a newer Alertmanager, delete this Secret, the postBuild
# block, and read the chat id from the mounted secret like the bot token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-vars
  namespace: flux-system
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: alertmanager-telegram-vars
  data:
    - secretKey: TELEGRAM_CHAT_ID # pragma: allowlist secret
      remoteRef:
        key: alertmanager-telegram-chat-id
