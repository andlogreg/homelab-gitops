apiVersion: postgresql.cnpg.io/v1
kind: Cluster
# BACKUP GENERATION CONVENTION: the `-NN` suffix is the backup generation. The barman
# plugin uses the Cluster name as the serverName, so each generation gets its own dir
# under `cnpg-backups/litellm/<litellm-db-NN>/`. On every cluster REBUILD, bump NN
# (-00 -> -01 -> ...) so the fresh cluster cannot overwrite the previous generation's
# WAL/base, and point recovery's externalCluster serverName at the prior NN. Never reuse
# a retired NN; prune a retired serverName dir only after the new generation is healthy.
metadata:
  name: litellm-db-00
spec:
  instances: 1

  # See the equivalent note in apps/base/mealie/postgresql.yaml: this creates the
  # PodMonitor for the metrics the instance already serves on :9187, which is what
  # makes WAL-archiving alerting possible.
  monitoring:
    enablePodMonitor: true

  bootstrap:
    initdb:
      database: litellm

  storage:
    size: 1Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: litellm-db-objectstore
