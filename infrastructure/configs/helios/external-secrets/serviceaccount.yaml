# ESO federates this projected ServiceAccount token to Azure — no client secret is
# ever stored in helios. Identifiers are non-secret ConfigMap substitutions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-azure-wi
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: "${ESO_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${AZURE_TENANT_ID}"
