---
# Credentials for the Alertmanager receivers, mounted into the Alertmanager pod
# by alertmanagerSpec.secrets (see the kube-prometheus-stack values patch) at
# /etc/alertmanager/secrets/alertmanager-telegram/. Both are referenced from the
# config by *_file so nothing sensitive is rendered into a manifest.
#
# healthchecks-url is the dead-man's-switch ping URL: a capability URL, so treat
# it as a secret even though it carries no token field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: alertmanager-telegram
  data:
    - secretKey: bot-token # pragma: allowlist secret
      remoteRef:
        key: alertmanager-telegram-bot-token
    - secretKey: healthchecks-url # pragma: allowlist secret
      remoteRef:
        key: alertmanager-deadmansswitch-url
