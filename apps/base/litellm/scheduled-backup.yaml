apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: litellm-db-scheduled-backup
spec:
  schedule: "0 0 4 * * *"  # At 4am every day
  backupOwnerReference: self
  cluster:
    name: litellm-db-00
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
