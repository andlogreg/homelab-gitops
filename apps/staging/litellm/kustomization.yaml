apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - ../../base/litellm
  - ingress.yaml
  - objectstore-archive.yaml

patches:
  # task-21: recover the CNPG db from the frozen pre-teardown archive (see recovery.yaml)
  - path: recovery.yaml
    target:
      kind: Cluster
      name: litellm-db-00
  - path: references_patch.yaml

configMapGenerator:
  - name: litellm-config
    behavior: merge
    files:
      - config.yaml
    literals:
      - LANGFUSE_TRACING_ENVIRONMENT=staging
