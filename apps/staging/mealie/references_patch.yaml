# task-21 recovery: repoint everything that referenced mealie-db-00 at the recovered
# mealie-db-01 (app POSTGRES_URL_OVERRIDE secret, the ESO-templated app secret + its rw
# hostname, and the ScheduledBackup target).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  annotations:
    # POSTGRES_URL_OVERRIDE is an env var from a secretKeyRef, and kubelet never
    # hot-reloads those. Without this, a rotated DB password reaches Postgres
    # (CNPG re-keys the role itself) but not mealie, which keeps serving HTTP 200
    # on its already-authenticated pooled connections holding the old credential,
    # then fails at some arbitrary later restart with nothing tying the failure
    # back to the rotation. Named explicitly rather than reloader auto mode: this
    # is a single-replica app, so a restart is a real if short outage, and only
    # the secrets listed here are worth one.
    secret.reloader.stakater.com/reload: "mealie-db-01-app,mealie-openai-secret" # pragma: allowlist secret
spec:
  template:
    spec:
      containers:
        - name: mealie
          env:
            - name: POSTGRES_URL_OVERRIDE
              valueFrom:
                secretKeyRef:
                  name: mealie-db-01-app
                  key: uri
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-db-credentials
spec:
  target:
    name: mealie-db-01-app
    template:
      data:
        password: "{{ .password }}"
        pgpass: "mealie-db-01-rw:5432:mealie:mealie:{{ .password }}"
        jdbc-uri: "jdbc:postgresql://mealie-db-01-rw.mealie:5432/mealie?password={{ .password }}&user=mealie"
        uri: "postgresql://mealie:{{ .password }}@mealie-db-01-rw.mealie:5432/mealie"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-db-scheduled-backup
spec:
  cluster:
    name: mealie-db-01
