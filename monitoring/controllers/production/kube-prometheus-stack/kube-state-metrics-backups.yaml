---
# Makes backup FRESHNESS observable, for both halves of the backup path. Nothing
# else here can do it.
#
# ---------------------------------------------------------------------------
# PART 1 - CNPG
# ---------------------------------------------------------------------------
#
# Why this exists at all - it cost 5.7 days of silently-dead scheduled backups to
# find out - is that the obvious metrics are a trap.
#
#   cnpg_collector_last_available_backup_timestamp   0
#   cnpg_collector_first_recoverability_point        0
#   .status.lastSuccessfulBackup                     (empty)
#
# Those are populated by the DEPRECATED in-tree barmanObjectStore, not by the
# barman-cloud plugin this repo uses. They read a permanent literal 0 rather than
# going absent, so a rule written against them is permanently firing or permanently
# silent depending only on the comparison operator - never correct. Every CNPG
# monitoring guide written before the plugin recommends them.
#
# Nor can the Cluster status conditions be used. Through the entire outage they read
# ContinuousArchiving=True and LastBackupSucceeded=True, because they describe the
# last backup that RAN, not whether one ran RECENTLY. A backup monitor has to measure
# freshness, not last-known-outcome.
#
# So the state is read straight off the CRs via kube-state-metrics custom-resource-state.
# This is not an invention - it is the same mechanism Flux's own monitoring example
# uses to expose Kustomization state.
#
# NAMING: cnpg_scheduledbackup_* and cnpg_backup_* are emitted by KUBE-STATE-METRICS,
# not by CloudNativePG. Searching the CNPG docs for them will find nothing. They carry
# job="kube-state-metrics", which is the giveaway.
#
# NOT IN base/: helios installs neither CNPG nor Velero, so a custom-resource-state
# config naming postgresql.cnpg.io or velero.io there would reference CRDs that do not
# exist. This file is duplicated in the staging overlay for the same reason. dev is
# left out too - it has CNPG but no Velero and no backup path worth watching.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  values:
    kube-state-metrics:
      # The stock ClusterRole knows nothing about CNPG's API group. Without this the
      # informer cannot list/watch and the metrics are simply absent - which looks
      # identical to "no backups are configured".
      rbac:
        extraRules:
          - apiGroups: ["postgresql.cnpg.io"]
            resources: ["backups", "scheduledbackups"]
            verbs: ["list", "watch"]
          - apiGroups: ["velero.io"]
            resources: ["backuprepositories"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              # THE important one. status.lastScheduleTime is the only honest answer to
              # "did the scheduler actually fire", and it is what was frozen at
              # 2026-07-26 for 5.7 days while everything else reported healthy.
              # RFC3339 strings are parsed to a float Unix timestamp automatically.
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: ScheduledBackup
                metricNamePrefix: cnpg_scheduledbackup
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                  cluster: [spec, cluster, name]
                metrics:
                  - name: last_schedule_time
                    help: "Unix time the CNPG ScheduledBackup controller last actually scheduled a backup. Staleness here means the schedule is dead, regardless of what the Cluster conditions say."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastScheduleTime]
              # Secondary: lets a stuck backup be seen directly rather than inferred
              # from the absence of new ones. The 5.7-day outage was CAUSED by Backup
              # CRs wedged in `pending` - the operator refuses to start a new scheduled
              # backup while one is outstanding, so `pending` is not a harmless
              # transient state here, it is the failure mode.
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Backup
                metricNamePrefix: cnpg_backup
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                  cluster: [spec, cluster, name]
                metrics:
                  - name: phase
                    help: "CNPG Backup phase as a state set. A `pending` that never clears blocks the whole ScheduledBackup controller."
                    each:
                      type: StateSet
                      stateSet:
                        labelName: phase
                        path: [status, phase]
                        list: [pending, started, running, completed, failed, walArchivingFailing]
              # -----------------------------------------------------------------
              # PART 2 - Velero / kopia
              # -----------------------------------------------------------------
              # The repository can be DEAD while every status field reads healthy.
              # That is not hypothetical: staging's kopia repository was unopenable
              # from 2026-08-13, and for 21 days
              #
              #   BackupRepository .status.phase        Ready
              #   Schedule         .status.lastBackup   (today)
              #   velero_backup_last_status             1
              #
              # all read exactly as they do on a healthy cluster. The backups were
              # capturing every Kubernetes resource and zero bytes of volume data.
              #
              # velero_backup_last_status cannot express this and never will: Velero
              # reports PartiallyFailed as 1, the same value as success. So the two
              # outcome rules built on it (VeleroBackupFailed, VeleroBackupFailing)
              # are structurally blind to a backup that succeeds at capturing
              # nothing. Freshness again, not last-known-outcome.
              #
              # status.lastMaintenanceTime is the honest field. Velero advances it
              # ONLY when a maintenance run succeeds - measured, not assumed: staging
              # retried every 5 minutes for 22 days with recentMaintenance showing
              # nothing but `repository not initialized in the provided storage`, and
              # the timestamp never moved off 2026-08-13T20:27:28Z. Maintenance
              # succeeding means the repository opened, which is the property no
              # other field here reports.
              #
              # This is also the EARLY signal. VeleroNoNewBackup does catch this
              # class, but only ~26-27h after the last good backup - i.e. after the
              # next daily has already run and failed. Maintenance runs hourly, so
              # this speaks up the same working day.
              - groupVersionKind:
                  group: velero.io
                  version: v1
                  kind: BackupRepository
                metricNamePrefix: velero_backuprepository
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                  volume_namespace: [spec, volumeNamespace]
                  repository_type: [spec, repositoryType]
                metrics:
                  - name: last_maintenance_time
                    help: "Unix time a kopia repository maintenance run last SUCCEEDED. Velero does not advance this on failure, so staleness means the repository could not be opened - while phase stays Ready and backups keep reporting success."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, lastMaintenanceTime]
