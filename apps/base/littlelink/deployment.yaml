apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlelink
spec:
  replicas: 1
  # Left on the default RollingUpdate on purpose, unlike most of its neighbours here: this
  # app is stateless - no PVC, no database, config comes from a ConfigMap - so there is no
  # shared file for the old and new pod to fight over during the overlap. Public-facing, so
  # the seamless swap is worth keeping.
  selector:
    matchLabels:
      app: littlelink
  template:
    metadata:
      labels:
        app: littlelink
    spec:
      containers:
        - name: littlelink
          image: ghcr.io/timothystewart6/littlelink-server:latest
          ports:
            - containerPort: 3000
          envFrom:
          - configMapRef:
              name: littlelink
          securityContext:
            allowPrivilegeEscalation: false
          # This app exposes no health route, so / is the only honest signal - it serves the
          # links page and nothing else. It starts in seconds, but the budget still matches
          # its neighbours: a shared-base edit restarts everything at once, and a tight
          # budget on a contended node gets a healthy app killed mid-start.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
