# task-21 recovery: repoint everything that referenced litellm-db-00 at the recovered
# litellm-db-01 (app DATABASE_URL secret, the ESO-templated app secret + its rw hostname,
# and the ScheduledBackup target).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  annotations:
    # DATABASE_URL is an env var from a secretKeyRef, and kubelet never
    # hot-reloads those. Without this, a rotated DB password reaches Postgres
    # (CNPG re-keys the role itself) but not litellm, which keeps running on its
    # already-open connections holding the old credential until something
    # restarts it - hours or weeks later, with nothing to connect the failure
    # back to the rotation. Named explicitly rather than reloader auto mode:
    # this is a single-replica app, so a restart is an outage and only the
    # secrets listed here are worth one.
    #
    # litellm-secrets is deliberately NOT listed. It carries LITELLM_SALT_KEY,
    # which encrypts provider keys stored in the database - rotating it in place
    # makes them undecryptable, and restarting faster does not help that.
    secret.reloader.stakater.com/reload: "litellm-db-01-app" # pragma: allowlist secret
spec:
  template:
    spec:
      containers:
        - name: litellm
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-db-01-app
                  key: uri
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-credentials
spec:
  target:
    name: litellm-db-01-app
    template:
      data:
        password: "{{ .password }}"
        pgpass: "litellm-db-01-rw:5432:litellm:litellm:{{ .password }}"
        jdbc-uri: "jdbc:postgresql://litellm-db-01-rw.litellm:5432/litellm?password={{ .password }}&user=litellm"
        uri: "postgresql://litellm:{{ .password }}@litellm-db-01-rw.litellm:5432/litellm"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: litellm-db-scheduled-backup
spec:
  cluster:
    name: litellm-db-01
