---
# DCGM exposes the current NVIDIA Xid error as a gauge. Unlike utilization or
# capacity, a non-zero Xid is a hardware/driver fault worth seeing after a lab job.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu-health
spec:
  groups:
    - name: gpu-health
      rules:
        - alert: NvidiaGpuXidError
          expr: 'DCGM_FI_DEV_XID_ERRORS > 0'
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "NVIDIA Xid error on {{ $labels.Hostname }} GPU {{ $labels.gpu }}"
            description: "DCGM reports NVIDIA Xid error {{ $value }}. Inspect the GPU Operator, driver, and host PCIe path."
