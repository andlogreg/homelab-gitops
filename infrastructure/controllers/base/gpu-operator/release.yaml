apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 12h
  chart:
    spec:
      chart: gpu-operator
      # v26.3.3 is the first supported major for helios's Kubernetes 1.36. Taken
      # only after it was proved against the real passed-through RTX 4090 - the
      # major had been held specifically because helios is the only consumer and
      # was powered off, so nobody could verify it.
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: gpu-operator
      interval: 12h
  values:
    toolkit:
      env:
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
    dcgmExporter:
      serviceMonitor:
        enabled: true
        interval: 15s
        honorLabels: true
    driver:
      # RENOVATE CANNOT SEE THIS PIN. The kubernetes and flux managers read image
      # tags and chart versions; a bare version string inside HelmRelease values is
      # invisible to both, and a custom manager cannot help because nvcr.io rejects
      # anonymous tag listing (401 even on /v2/). So this will not auto-update and
      # will not appear on the Dependency Dashboard - it is a pin that looks
      # maintained and is not, the same trap as the old kube-prometheus-stack range
      # pin. It is COUPLED to the chart major above: re-check it by hand whenever
      # gpu-operator is bumped (see the dependency-sweep runbook).
      #
      # Why pinned at all: 580.173.02 is NVIDIA's recommended driver for v26.3.3 and
      # keeps the operator on a K8s-1.36-supported release. It is NOT pinned to dodge
      # a firmware bug - that earlier theory was wrong, see below.
      version: "580.173.02"
      # DELIBERATE AND MEASURED, not a workaround. Read this before "fixing" it.
      #
      # The earlier RmFetchGspRmImages failure that first forced this line was never a
      # property of the card, the driver image, or the passthrough. It was stale kernel
      # state from an in-place driver upgrade: the driver entrypoint writes the
      # firmware search path only when /sys/module/firmware_class/parameters/path is
      # EMPTY, so after an earlier driver container had set it, every later container
      # logged "A search path is already configured ... Retaining the current
      # configuration" and the GSP fetch failed. On a clean load the firmware loads
      # fine. NVIDIA's documented /lib/firmware mount workaround is unrelated here - it
      # is scoped to the vGPU manager, and this chart already mounts both paths anyway.
      #
      # So the open module IS restorable, and was verified working: open module
      # (licence Dual MIT/GPL) + NVreg_EnableGpuFirmware=1 gives GSP Firmware Version
      # 580.173.02, ClusterPolicy ready, a GPU-requesting nvidia-smi pod at exit 0, and
      # nvidia.com/gpu allocatable. No driver change and no extra mounts needed.
      #
      # It is not used because it costs power. Measured on this card, the open module
      # idles at 26.5 W against 12.5 W for the proprietary module - it loads GSP but
      # never reaches the low-power state. That is roughly 14 W, continuously, for the
      # whole time the box is up. The full matrix is in the kernel-module-params
      # ConfigMap comment.
      #
      # The trade-off, stated plainly: this is off NVIDIA's preferred module for Ada
      # and gives up some forward compatibility, in exchange for ~14 W. Revisit if a
      # future driver drops the proprietary module for this card, or if this host stops
      # being on-demand and starts running continuously. To restore the open path, set
      # this to `open` and keep NVreg_EnableGpuFirmware=1 - the two are one decision.
      kernelModuleType: proprietary
      # kernel module configuration for NVIDIA driver
      kernelModuleConfig:
        name: "kernel-module-params"
    devicePlugin:
      config:
        name: time-slicing-config
        default: any
