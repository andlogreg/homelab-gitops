apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  replicas: 1
  # Recreate rather than the default RollingUpdate. At one replica a rolling update keeps
  # the old pod serving for the whole of the new pod's startup - and startup is exactly
  # when Alembic migrates the schema underneath it, so the old code would be reading a
  # database it no longer matches. The PVC is RWO on local-path, which fences nothing on a
  # single-node cluster, so both pods really would hold it at once. This costs a few
  # seconds more downtime than the rolling update already caused and removes the overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.21.0
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: mealie-config
          env:
            - name: POSTGRES_URL_OVERRIDE
              valueFrom:
                secretKeyRef:
                  name: mealie-db-00-app
                  key: uri
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data/
          # /api/app/about is what the image's own HEALTHCHECK uses, and it needs no auth.
          # Mealie runs its migrations inside the ASGI lifespan, so uvicorn does not bind
          # the port until they finish - the socket refuses connections rather than
          # answering wrongly, which is what makes an HTTP probe trustworthy here.
          #
          # Budget: 5s x 90 = 450s. Sized as a ceiling on how long a stuck start may hang,
          # not as an estimate of a normal one - so it has to survive the worst case, which
          # is every app on the cluster restarting at once. These manifests are shared by
          # more than one cluster overlay, so a single edit here does exactly that, and on a
          # 2-core node six simultaneous cold starts stretch each one well past its usual
          # time. An earlier, tighter budget was exceeded that way and the container was
          # killed mid-start, which only added another cold start to a saturated node.
          # Still under the 600s default progressDeadlineSeconds, so a genuinely stuck start
          # fails the rollout rather than hanging forever.
          startupProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 90
          # Tight, because startupProbe already covered the slow boot. failureThreshold 3
          # rather than 1: single replica, so a flap has nothing to fail over to.
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
