apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  annotations:
    # Unlike the env-var consumers, this secret IS mounted as a file, so kubelet
    # does update it in place - but cloudflared reads config.yaml and
    # credentials.json once at startup and never again, so the rotated tunnel
    # credential would still never take effect. Two replicas, so the reload is a
    # rolling restart with no gap in the tunnel.
    secret.reloader.stakater.com/reload: "cloudflared-tunnel-config" # pragma: allowlist secret
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.7.3
        command:
          - cloudflared
          - tunnel
          - --config
          - /etc/cloudflared/config/config.yaml
          - run
        # Guards the aggressive liveness probe below, which kills the pod on a single failed
        # check 10s after start. That was survivable while nothing waited for readiness; now
        # that a rollout does, a tunnel that takes a moment to connect could restart-loop
        # instead of just being slow. A startupProbe suspends liveness until it passes.
        startupProbe:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 1
          periodSeconds: 10
        # Same endpoint as the liveness probe: /ready returns 200 only while the tunnel holds
        # an active connection to Cloudflare, which is the only useful definition of ready
        # for this workload. Adding it changes nothing about traffic - there is no Service in
        # front of these pods, since the tunnel dials outbound - but it does make a rollout
        # wait for a connected tunnel instead of a started process, so rollout status stops
        # reporting success on a tunnel that is not up yet.
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: creds
          mountPath: /etc/cloudflared/creds
          readOnly: true
      volumes:
      - name: config
        secret:
          secretName: cloudflared-tunnel-config # pragma: allowlist secret
          items:
            - key: config.yaml
              path: config.yaml
      - name: creds
        secret:
          secretName: cloudflared-tunnel-config # pragma: allowlist secret
          items:
            - key: credentials.json
              path: credentials.json
