---
# cloudflared is the only ingress path for everything published outside the LAN, and
# nothing watched it. If every tunnel connection drops, the household loses external
# access to all of it and the cluster itself looks perfectly healthy from the inside.
#
# No flag change was needed to get here: cloudflared's metrics server is ALREADY bound
# on :2000 - it is the same server the Deployment's existing /ready startup and
# liveness probes hit. /metrics was serving cloudflared_tunnel_ha_connections all
# along with no scraper attached.
#
# Lives in the configs layer for the same reason as podmonitor-reloader.yaml: this
# layer depends on the monitoring controllers, so the PodMonitor CRD is guaranteed to
# exist before this is applied.
#
# Two cloudflared deployments run here and both are worth scraping - the cloudflared
# namespace fronts the main apps, littlelink runs its own for the personal site. The
# namespaceSelector covers both rather than pinning one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cloudflared
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - cloudflared
      - littlelink
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - targetPort: 2000
      path: /metrics
