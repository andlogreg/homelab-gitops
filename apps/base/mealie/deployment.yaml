apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.9.1
          ports:
            - containerPort: 9000
          env:
            - name: DB_ENGINE
              value: "postgres"
            # - name: POSTGRES_SERVER
            #   valueFrom:
            #     secretKeyRef:
            #       name: mealie-db-00-app
            #       key: host
            # - name: POSTGRES_PORT
            #   valueFrom:
            #     secretKeyRef:
            #       name: mealie-db-00-app
            #       key: port
            # - name: POSTGRES_DB
            #   value: "mealie"
            # - name: POSTGRES_USER
            #   value: "mealie"
            # - name: POSTGRES_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: mealie-db-credentials
            #       key: password
            - name: POSTGRES_URL_OVERRIDE
              valueFrom:
                secretKeyRef:
                  name: mealie-db-00-app
                  key: uri
            - name: ALLOW_SIGNUP
              value: "false"
            - name: PU_ID
              value: "1000"
            - name: PG_ID
              value: "1000"
            - name: TZ
              value: "Europe/London"
          volumeMounts:
            - name: mealie-data
              mountPath: /app/data/
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
