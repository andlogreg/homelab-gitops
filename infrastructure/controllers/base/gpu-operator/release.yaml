apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
spec:
  interval: 12h
  chart:
    spec:
      chart: gpu-operator
      # v26.3.3 is the first supported major for helios's Kubernetes 1.36. Taken
      # only after it was proved against the real passed-through RTX 4090 - the
      # major had been held specifically because helios is the only consumer and
      # was powered off, so nobody could verify it.
      version: v26.3.3
      sourceRef:
        kind: HelmRepository
        name: gpu-operator
      interval: 12h
  values:
    toolkit:
      env:
        - name: CONTAINERD_SOCKET
          value: /run/k3s/containerd/containerd.sock
    dcgmExporter:
      serviceMonitor:
        enabled: true
        interval: 15s
        honorLabels: true
    driver:
      # RENOVATE CANNOT SEE THIS PIN. The kubernetes and flux managers read image
      # tags and chart versions; a bare version string inside HelmRelease values is
      # invisible to both, and a custom manager cannot help because nvcr.io rejects
      # anonymous tag listing (401 even on /v2/). So this will not auto-update and
      # will not appear on the Dependency Dashboard - it is a pin that looks
      # maintained and is not, the same trap as the old kube-prometheus-stack range
      # pin. It is COUPLED to the chart major above: re-check it by hand whenever
      # gpu-operator is bumped (see the dependency-sweep runbook).
      #
      # Why pinned at all: v26.3.3's default driver image could not initialise this
      # card - the open kernel module failed at RmFetchGspRmImages, i.e. it could not
      # load the Ada GSP firmware. Ruled out first, so this is not a repeat of the
      # 6-2 trap: the guest ROM BAR was present (~512 KiB at
      # /sys/bus/pci/devices/0000:01:00.0/rom) and the hypervisor showed rombar=1, so
      # the card's VBIOS was reachable and the fault was inside the driver image, not
      # the passthrough. 580.173.02 is NVIDIA's recommended driver for v26.3.3 and
      # keeps the operator on a K8s-1.36-supported release.
      version: "580.173.02"
      # Consequence of the above: the proprietary module, because the OPEN modules
      # require GSP and cannot load without it - so this line and
      # NVreg_EnableGpuFirmware=0 in kernel-module-params are one decision, not two.
      # It is off NVIDIA's preferred path for Ada, and it also reverses a deliberate
      # earlier power-management setting (see the ConfigMap's comment; measured idle
      # draw on this card was ~9 W with GSP on). Treat it as a workaround under
      # investigation: if the firmware load is fixed, restore the open module and
      # GSP together and re-measure idle draw.
      kernelModuleType: proprietary
      # kernel module configuration for NVIDIA driver
      kernelModuleConfig:
        name: "kernel-module-params"
    devicePlugin:
      config:
        name: time-slicing-config
        default: any
