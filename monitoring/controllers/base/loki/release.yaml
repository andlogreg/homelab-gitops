apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  dependsOn:
    - kube-prometheus-stack
  interval: 12h
  chart:
    spec:
      chart: loki
      version: "6.51.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
      interval: 12h
  install:
    crds: Create
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    loki:
      commonConfig:
        replication_factor: 1
      auth_enabled: false
      schemaConfig:
        configs:
          - from: "2026-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      compactor:
        working_directory: /var/loki/compactor
        retention_enabled: true
        retention_delete_delay: 6h
        retention_delete_worker_count: 1
        compaction_interval: 60m
        delete_request_store: filesystem
      limits_config:
        retention_period: 96h
        # Low ingestion rate limit to prevent overloading the system
        ingestion_rate_mb: 1
        ingestion_burst_size_mb: 2
        max_streams_per_user: 1000
        max_global_streams_per_user: 2000
        max_line_size: 128000
      storage:
        type: filesystem
      analytics:
        reporting_enabled: false
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 2Gi


    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0
