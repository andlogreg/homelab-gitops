---
# Scrape Reloader so a pod restart is attributable after the fact:
# reloader_reload_executed_total tells you which namespace a reload fired in and
# whether it succeeded. Without it, an automatic restart looks exactly like a
# crash in the pod list.
#
# Two things about where this lives:
#
#   - It is HERE, in the configs layer, not enabled through the Reloader chart's
#     own podMonitor value. The PodMonitor CRD is installed by the monitoring
#     controllers layer, which has no ordering relationship with the
#     infrastructure controllers layer that owns the Reloader HelmRelease - so on
#     a from-scratch bootstrap the chart-rendered PodMonitor could be applied
#     before its CRD exists. This layer depends on the monitoring controllers, so
#     it cannot. (Same reason the velero ExternalSecret lives in configs.)
#
#   - The release=kube-prometheus-stack label USED to be load-bearing, and is now
#     only conventional. podMonitorSelector was left at the chart default (matching
#     only this label) while the serviceMonitor / scrapeConfig / rule selectors were
#     relaxed to {}; it has since been relaxed too, because PodMonitors generated
#     by other charts (CNPG, Velero node-agent) cannot be given the label and were
#     therefore silently never scraped. The label is kept here by convention, not
#     necessity.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: reloader
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - reloader
  selector:
    matchLabels:
      app: reloader
      release: reloader
  podMetricsEndpoints:
    - port: http
      path: /metrics
