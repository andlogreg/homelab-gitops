apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: akri
spec:
  interval: 12h
  chart:
    spec:
      chart: akri
      # Exact, like every other chart here - a range pin hides the deployed
      # version and Renovate will not widen it.
      version: "0.13.8"
      sourceRef:
        kind: HelmRepository
        name: akri
        namespace: akri
      interval: 12h
  # https://github.com/project-akri/akri/blob/main/deployment/helm/values.yaml
