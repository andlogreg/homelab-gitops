apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-backup-creds
spec:
  refreshInterval: 3h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secret-store
  target:
    name: velero-backup-creds
    template:
      data:
        # Velero mounts this at /credentials/cloud and parses it as a dotenv file, which accepts
        # this "KEY: value" form as well as "KEY=value". Both the server and the node-agent read
        # it, so this one file also credentials the kopia/PodVolumeBackup path.
        #
        # These three make Velero build a client-secret Entra credential scoped to the
        # velero-backups container alone: it cannot reach the CNPG backups and holds no ARM
        # permission. They only take effect alongside useAAD=true and an empty
        # storageAccountKeyEnvVar in the BSL config — otherwise Velero ignores them and keeps
        # using the account key.
        #
        # Single quotes are deliberate: a dotenv parser expands ${...} inside double quotes, and a
        # client secret is not worth betting on never containing a dollar sign.
        cloud: |
          AZURE_CLIENT_ID: '{{ .AZURE_CLIENT_ID }}'
          AZURE_TENANT_ID: '{{ .AZURE_TENANT_ID }}'
          AZURE_CLIENT_SECRET: '{{ .AZURE_CLIENT_SECRET }}'
  data:
  - secretKey: AZURE_CLIENT_ID
    remoteRef:
      key: azure-backup-velero-client-id
  - secretKey: AZURE_TENANT_ID
    remoteRef:
      key: azure-tenant-id
  - secretKey: AZURE_CLIENT_SECRET # pragma: allowlist secret
    remoteRef:
      key: azure-backup-velero-client-secret
