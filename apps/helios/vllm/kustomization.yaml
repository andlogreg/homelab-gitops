apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vllm
resources:
  - ../../base/vllm/gpu

configMapGenerator:
  - name: vllm-config
    literals:
      - MODEL_NAME=meta-llama/Meta-Llama-3-8B-Instruct
      - IGNORE_ME=Mistral-7B-Instruct-v0.3
      - IGNORE_ME2=meta-llama/Llama-3.1-8B-Instruct
      - VLLM_ARGS="--gpu-memory-utilization 0.90 --port 8000 --trust-remote-code --enable-chunked-prefill --max_num_batched_tokens 1024"
      - VLLM_LOGGING_LEVEL=DEBUG

patches:
  - target:
      kind: Deployment
      name: vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: vllm-config
